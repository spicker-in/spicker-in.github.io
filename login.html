<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – SpickerSeite</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window._auth = auth; window._db = db;
        window._firebaseFns = { signInWithEmailAndPassword, createUserWithEmailAndPassword, doc, getDoc, setDoc, serverTimestamp };
        window._firebaseReady = true;
        document.dispatchEvent(new Event('firebaseReady'));
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>emailjs.init("1OMejyyUkbzLcwj7t");</script>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #1b4f72;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
        }

        .login-box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .tab-switcher {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.2);
            padding: 5px;
            border-radius: 50px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 50px;
            background: transparent;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

            .tab-btn.active {
                background: #5dade2;
            }

        .input-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 50px;
            border: none;
            background: #5dade2;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .msg {
            margin-top: 15px;
            font-size: 14px;
            display: none;
            padding: 10px;
            border-radius: 8px;
        }

        .error {
            background: rgba(231, 76, 60, 0.3);
            color: #ff9999;
        }

        .success {
            background: rgba(46, 204, 113, 0.3);
            color: #99ff99;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>SpickerSeite</h1>
        <div class="tab-switcher">
            <button class="tab-btn active" id="t-login" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" id="t-reg" onclick="switchTab('reg')">Registrieren</button>
        </div>

        <div id="f-login">
            <div class="input-group"><input type="email" id="l-email" placeholder="E-Mail"></div>
            <div class="input-group"><input type="password" id="l-pass" placeholder="Passwort"></div>
            <button class="btn" onclick="doLogin()">Anmelden</button>
        </div>

        <div id="f-reg" style="display:none">
            <div class="input-group"><input type="text" id="r-name" placeholder="Vollständiger Name"></div>
            <div class="input-group"><input type="email" id="r-email" placeholder="E-Mail"></div>
            <div class="input-group"><input type="password" id="r-pass" placeholder="Passwort (min. 6 Zeichen)"></div>
            <button class="btn" onclick="doRegister()">Registrieren</button>
        </div>
        <div class="msg" id="msg"></div>
    </div>

    <script>
        const SUPERADMIN = 'julianknuhr92@gmail.com';
        function switchTab(t) {
            document.getElementById('f-login').style.display = t === 'login' ? 'block' : 'none';
            document.getElementById('f-reg').style.display = t === 'reg' ? 'block' : 'none';
            document.getElementById('t-login').classList.toggle('active', t === 'login');
            document.getElementById('t-reg').classList.toggle('active', t === 'reg');
        }

        async function doLogin() {
            const email = document.getElementById('l-email').value;
            const pass = document.getElementById('l-pass').value;
            try {
                const userCred = await window._firebaseFns.signInWithEmailAndPassword(window._auth, email, pass);
                const snap = await window._firebaseFns.getDoc(window._firebaseFns.doc(window._db, "users", userCred.user.uid));
                const data = snap.data();

                if (email.toLowerCase() === SUPERADMIN) {
                    window.location.href = 'admin.html';
                } else if (data.isApproved) {
                    window.location.href = 'start.html';
                } else {
                    alert("Dein Account wartet noch auf Freischaltung durch Julian.");
                }
            } catch (e) { alert("Fehler: " + e.message); }
        }

        async function doRegister() {
            const name = document.getElementById('r-name').value;
            const email = document.getElementById('r-email').value;
            const pass = document.getElementById('r-pass').value;
            try {
                const userCred = await window._firebaseFns.createUserWithEmailAndPassword(window._auth, email, pass);
                await window._firebaseFns.setDoc(window._firebaseFns.doc(window._db, "users", userCred.user.uid), {
                    name, email, isApproved: false, isAdmin: false, createdAt: window._firebaseFns.serverTimestamp(), permissions: {}
                });
                // Benachrichtigung an Julian
                emailjs.send("service_7twg9kk", "template_yh83gp9", { to_email: "julianknuhr92@gmail.com", user_name: name, user_email: email });
                document.getElementById('msg').textContent = "Erfolgreich! Julian prüft deine Anfrage.";
                document.getElementById('msg').className = "msg success";
                document.getElementById('msg').style.display = "block";
            } catch (e) { alert("Fehler: " + e.message); }
        }
    </script>
</body>
</html>
