<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – SpickerSeite</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
            sendPasswordResetEmail, setPersistence, browserLocalPersistence, browserSessionPersistence
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window._auth = auth;
        window._db = db;
        window._firebaseFns = {
            signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail,
            setPersistence, browserLocalPersistence, browserSessionPersistence,
            doc, getDoc, setDoc, serverTimestamp
        };
    </script>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #1b4f72;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .login-box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        .tab-switcher {
            display: flex;
            background: rgba(0,0,0,0.2);
            border-radius: 50px;
            padding: 5px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 50px;
            background: transparent;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

            .tab-btn.active {
                background: #5dade2;
            }

        .input-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            outline: none;
            box-sizing: border-box;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 50px;
            border: none;
            background: #5dade2;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Das Design für die Status-Nachricht */
        .status-msg {
            display: none;
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            background: rgba(46, 204, 113, 0.2);
            color: #99ff99;
            border: 1px solid rgba(46, 204, 113, 0.4);
            text-align: left;
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 13px;
        }

        .forgot-link {
            color: #a8d8ea;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🎓 SpickerSeite</h1>

        <div class="tab-switcher">
            <button class="tab-btn active" id="t-login" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" id="t-reg" onclick="switchTab('reg')">Registrieren</button>
        </div>

        <!-- HIER IST DAS WICHTIGE ELEMENT, DAS GEFEHLT HAT -->
        <div id="status-msg" class="status-msg"></div>

        <div id="f-login">
            <div class="input-group">
                <input type="email" id="l-email" placeholder="E-Mail" onkeydown="handleEnter(event, 'l-pass')">
            </div>
            <div class="input-group">
                <input type="password" id="l-pass" placeholder="Passwort" onkeydown="handleEnter(event, 'LOGIN')">
            </div>
            <div class="options-row">
                <label><input type="checkbox" id="l-remember" checked> Angemeldet bleiben</label>
                <span class="forgot-link" onclick="doForgotPassword()">Passwort vergessen?</span>
            </div>
            <button class="btn" onclick="doLogin()">Anmelden</button>
        </div>

        <div id="f-reg" style="display:none">
            <div class="input-group"><input type="text" id="r-name" placeholder="Name" onkeydown="handleEnter(event, 'r-email')"></div>
            <div class="input-group"><input type="email" id="r-email" placeholder="E-Mail" onkeydown="handleEnter(event, 'r-pass')"></div>
            <div class="input-group"><input type="password" id="r-pass" placeholder="Passwort" onkeydown="handleEnter(event, 'REGISTER')"></div>
            <button class="btn" onclick="doRegister()">Registrieren</button>
        </div>
    </div>

    <script>
        const SUPERADMIN = 'julianknuhr92@gmail.com';

        function handleEnter(e, action) {
            if (e.key === 'Enter') {
                if (action === 'LOGIN') doLogin();
                else if (action === 'REGISTER') doRegister();
                else document.getElementById(action).focus();
            }
        }

        function switchTab(t) {
            document.getElementById('f-login').style.display = t === 'login' ? 'block' : 'none';
            document.getElementById('f-reg').style.display = t === 'reg' ? 'block' : 'none';
            document.getElementById('t-login').classList.toggle('active', t === 'login');
            document.getElementById('t-reg').classList.toggle('active', t === 'reg');
            document.getElementById('status-msg').style.display = 'none';
        }

        async function doLogin() {
            const email = document.getElementById('l-email').value.trim();
            const pass = document.getElementById('l-pass').value;
            const remember = document.getElementById('l-remember').checked;
            if (!email || !pass) return alert("Bitte Felder ausfüllen!");

            try {
                const f = window._firebaseFns;
                await f.setPersistence(window._auth, remember ? f.browserLocalPersistence : f.browserSessionPersistence);
                const userCred = await f.signInWithEmailAndPassword(window._auth, email, pass);
                const snap = await f.getDoc(f.doc(window._db, "users", userCred.user.uid));
                const data = snap.data();

                if (email.toLowerCase() === SUPERADMIN) window.location.href = 'admin.html';
                else if (data && data.isApproved) window.location.href = 'start.html';
                else alert("Warte auf Freischaltung durch Julian.");
            } catch (e) { alert("Login fehlgeschlagen."); }
        }

        async function doRegister() {
            const name = document.getElementById('r-name').value.trim();
            const email = document.getElementById('r-email').value.trim();
            const pass = document.getElementById('r-pass').value;
            if (!name || !email || !pass) return alert("Bitte alles ausfüllen!");

            try {
                const f = window._firebaseFns;
                const userCred = await f.createUserWithEmailAndPassword(window._auth, email, pass);
                await f.setDoc(f.doc(window._db, "users", userCred.user.uid), {
                    name, email, isApproved: false, isAdmin: false, createdAt: f.serverTimestamp()
                });
                alert("Anfrage gesendet!");
                switchTab('login');
            } catch (e) { alert(e.message); }
        }

        async function doForgotPassword() {
            const email = document.getElementById('l-email').value.trim();
            const statusEl = document.getElementById('status-msg');

            if (!email) {
                alert("Bitte gib zuerst deine E-Mail Adresse ein.");
                return;
            }

            try {
                await window._firebaseFns.sendPasswordResetEmail(window._auth, email);

                // Jetzt existiert das Element sicher!
                if (statusEl) {
                    statusEl.textContent = `Eine Email wurde an ${email} versendet.`;
                    statusEl.style.display = 'block';
                    setTimeout(() => { statusEl.style.display = 'none'; }, 10000);
                }
            } catch (e) {
                alert("Fehler: " + e.message);
            }
        }
    </script>
</body>
</html>
