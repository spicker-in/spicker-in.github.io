<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login – SpickerSeite</title>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
            sendPasswordResetEmail, setPersistence, browserLocalPersistence, browserSessionPersistence
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import {
            getFirestore, doc, getDoc, setDoc, serverTimestamp,
            query, where, collection, getDocs
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window._auth = auth;
        window._db = db;
        window._firebaseFns = {
            signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail,
            setPersistence, browserLocalPersistence, browserSessionPersistence,
            doc, getDoc, setDoc, serverTimestamp, query, where, collection, getDocs
        };
    </script>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #1b4f72;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .login-box {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-bottom: 25px;
            font-size: 28px;
            letter-spacing: 1px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: rgba(255,255,255,0.2);
            color: white;
            outline: none;
            box-sizing: border-box;
            font-size: 16px;
        }

            input::placeholder {
                color: rgba(255,255,255,0.6);
            }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 50px;
            border: none;
            background: #5dade2;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            font-size: 16px;
            transition: 0.3s;
        }

            .btn:hover {
                background: #3498db;
                transform: translateY(-2px);
            }

        .status-msg {
            display: none;
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            background: rgba(46, 204, 113, 0.2);
            color: #99ff99;
            border: 1px solid rgba(46, 204, 113, 0.4);
            text-align: left;
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .action-links {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            font-size: 14px;
        }

        .link-btn {
            color: #a8d8ea;
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 14px;
            padding: 0;
        }

            .link-btn:hover {
                text-decoration: underline;
            }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

            .checkbox-group input {
                width: auto;
                cursor: pointer;
                height: 16px;
                width: 16px;
            }
    </style>
</head>
<body>

    <div class="login-box">
        <h1>🎓 SpickerSeite</h1>

        <!-- Status / Fehlermeldungen -->
        <div id="status-msg" class="status-msg"></div>

        <!-- LOGIN FORM -->
        <div id="f-login">
            <div class="input-group">
                <input type="text" id="l-email" placeholder="username / email-adresse" onkeydown="handleEnter(event, 'l-pass')">
            </div>
            <div class="input-group">
                <input type="password" id="l-pass" placeholder="passwort" onkeydown="handleEnter(event, 'LOGIN')">
            </div>

            <div class="options-row">
                <label class="checkbox-group">
                    <input type="checkbox" id="l-remember" checked> Angemeldet bleiben
                </label>
            </div>

            <button class="btn" onclick="doLogin()">Anmelden</button>

            <div class="action-links">
                <button class="link-btn" onclick="doForgotPassword()">passwort vergessen</button>
                <button class="link-btn" onclick="switchView('reg')">registrieren</button>
            </div>
        </div>

        <!-- REGISTER FORM (Schritt 1: Daten eingeben & Code senden) -->
        <div id="f-reg" style="display:none">
            <h3 style="margin-top:0; font-size:18px; color:#a8d8ea;">Registrierung</h3>
            <div class="input-group">
                <input type="text" id="r-name" placeholder="Vollständiger Name">
            </div>
            <div class="input-group">
                <input type="email" id="r-email" placeholder="E-Mail-Adresse">
            </div>
            <div class="input-group">
                <input type="password" id="r-pass" placeholder="Passwort (min. 6 Zeichen)">
            </div>
            <button class="btn" onclick="startRegistration()">6-stelligen Code senden</button>

            <div class="action-links" style="justify-content: center; margin-top: 15px;">
                <button class="link-btn" onclick="switchView('login')">Zurück zum Login</button>
            </div>
        </div>

        <!-- CODE VERIFY FORM (Schritt 2: 6-stelligen Code bestätigen) -->
        <div id="f-code" style="display:none">
            <h3 style="margin-top:0; font-size:18px; color:#a8d8ea;">Code bestätigen</h3>
            <p style="font-size:13px; opacity:0.8; margin-bottom:15px;">Wir haben dir einen 6-stelligen Bestätigungscode gesendet.</p>
            <div class="input-group">
                <input type="text" id="r-code-input" placeholder="123456" maxlength="6" style="text-align: center; letter-spacing: 4px; font-size: 20px;">
            </div>
            <button class="btn" onclick="verifyCodeAndRegister()">Code bestätigen & Anfragen</button>
        </div>
    </div>

    <script>
        const SUPERADMIN = 'julianknuhr92@gmail.com';
        let temporaryUserData = null;
        let generatedCode = '';

        function handleEnter(e, action) {
            if (e.key === 'Enter') {
                if (action === 'LOGIN') doLogin();
                else document.getElementById(action).focus();
            }
        }

        // Zwischen Ansichten umschalten (login, reg, code)
        function switchView(view) {
            document.getElementById('f-login').style.display = view === 'login' ? 'block' : 'none';
            document.getElementById('f-reg').style.display = view === 'reg' ? 'block' : 'none';
            document.getElementById('f-code').style.display = view === 'code' ? 'block' : 'none';
            hideStatus();
        }

        function showStatus(text, isError = false) {
            const el = document.getElementById('status-msg');
            el.textContent = text;
            el.style.display = 'block';
            el.style.background = isError ? 'rgba(231, 76, 60, 0.2)' : 'rgba(46, 204, 113, 0.2)';
            el.style.color = isError ? '#ff9999' : '#99ff99';
            el.style.borderColor = isError ? 'rgba(231, 76, 60, 0.4)' : 'rgba(46, 204, 113, 0.4)';
        }

        function hideStatus() {
            document.getElementById('status-msg').style.display = 'none';
        }

        // LOGIN
        async function doLogin() {
            const email = document.getElementById('l-email').value.trim();
            const pass = document.getElementById('l-pass').value;
            const remember = document.getElementById('l-remember').checked;

            if (!email || !pass) return showStatus("Bitte E-Mail und Passwort eingeben!", true);

            try {
                const f = window._firebaseFns;
                await f.setPersistence(window._auth, remember ? f.browserLocalPersistence : f.browserSessionPersistence);

                const userCred = await f.signInWithEmailAndPassword(window._auth, email, pass);
                const snap = await f.getDoc(f.doc(window._db, "users", userCred.user.uid));
                const data = snap.data();

                if (email.toLowerCase() === SUPERADMIN) {
                    window.location.href = 'admin.html';
                } else if (data && data.isApproved) {
                    window.location.href = 'start.html';
                } else {
                    showStatus("Dein Account wurde noch nicht von Julian freigeschaltet.", true);
                }
            } catch (e) {
                showStatus("Login fehlgeschlagen. Bitte Daten prüfen.", true);
            }
        }

        // SCHRITT 1: Registrierungsdaten prüfen & 6-stelligen Code generieren
        async function startRegistration() {
            const name = document.getElementById('r-name').value.trim();
            const email = document.getElementById('r-email').value.trim();
            const pass = document.getElementById('r-pass').value;

            if (!name || !email || !pass) return showStatus("Bitte alle Felder ausfüllen!", true);
            if (pass.length < 6) return showStatus("Das Passwort muss mindestens 6 Zeichen haben.", true);

            // 6-stelligen Code generieren (z.B. "482910")
            generatedCode = Math.floor(100000 + Math.random() * 900000).toString();
            temporaryUserData = { name, email, pass };

            // In einer echten App würdest du hier den Code per E-Mail-API (z.B. EmailJS, SendGrid oder Firebase Extension) senden.
            // Für den Test geben wir ihn dir testweise als Hinweis aus:
            console.log("Dein 6-stelliger Bestätigungscode:", generatedCode);
            alert("Simulierter E-Mail-Versand!\nDein 6-stelliger Code lautet: " + generatedCode);

            switchView('code');
            showStatus("Code wurde an " + email + " gesendet.");
        }

        // SCHRITT 2: Code prüfen & Account anlegen (mit Status isApproved = false für Admin)
        async function verifyCodeAndRegister() {
            const enteredCode = document.getElementById('r-code-input').value.trim();

            if (enteredCode !== generatedCode) {
                return showStatus("Falscher Code! Bitte überprüfe deine Eingabe.", true);
            }

            try {
                const f = window._firebaseFns;
                const { name, email, pass } = temporaryUserData;

                // Account in Firebase Authentication erstellen
                const userCred = await f.createUserWithEmailAndPassword(window._auth, email, pass);

                // In Firestore speichern (isApproved: false, damit Admin zustimmen muss)
                await f.setDoc(f.doc(window._db, "users", userCred.user.uid), {
                    name,
                    email,
                    isApproved: false,
                    isAdmin: false,
                    createdAt: f.serverTimestamp()
                });

                alert("E-Mail erfolgreich bestätigt! Dein Account wartet nun auf die Freigabe durch den Admin.");
                switchView('login');
                showStatus("Registrierung erfolgreich! Bitte warte auf Admin-Freigabe.");
            } catch (e) {
                showStatus("Fehler: " + e.message, true);
            }
        }

        // PASSWORT VERGESSEN
        async function doForgotPassword() {
            const email = document.getElementById('l-email').value.trim();
            if (!email) {
                alert("Bitte gib zuerst deine E-Mail-Adresse im Login-Feld ein.");
                document.getElementById('l-email').focus();
                return;
            }

            try {
                const f = window._firebaseFns;
                await f.sendPasswordResetEmail(window._auth, email);
                showStatus(`Eine E-Mail zum Zurücksetzen wurde an ${email} versendet.`);
            } catch (e) {
                if (e.code === 'auth/user-not-found') {
                    showStatus("Zu dieser E-Mail-Adresse existiert kein Benutzerkonto.", true);
                } else {
                    showStatus("Fehler beim Senden: " + e.message, true);
                }
            }
        }
    </script>
</body>
</html>
