<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Fachdetails – Spicker Informatik</title>
    <style>
        :root {
            --primary-blue: #1b4f72;
            --hover-grey: #e9ecef;
            --text-dark: #333;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80') no-repeat center fixed;
            background-size: cover;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- NAVBAR --- */
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 0 40px;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .nav-brand {
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

            .nav-links a {
                color: white;
                text-decoration: none;
                font-weight: 500;
                opacity: 0.8;
                transition: 0.3s;
                font-size: 0.95rem;
                white-space: nowrap;
            }

                .nav-links a:hover {
                    opacity: 1;
                }

        .user-display {
            opacity: 0.7;
            font-size: 0.9rem;
            color: white;
            font-weight: bold;
        }

        .logout-btn {
            opacity: 0.5;
            font-size: 0.9rem;
            cursor: pointer;
            color: white;
            text-decoration: none;
        }

        /* --- CONTENT --- */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
            box-sizing: border-box;
            width: 100%;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #exam-list {
            text-align: left;
            margin-top: 20px;
        }

        .exam-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

            .exam-item:hover {
                background: rgba(255, 255, 255, 0.15);
            }

        .settings-icon {
            cursor: pointer;
            opacity: 0.5;
            margin-left: 10px;
            font-size: 1.1rem;
            transition: 0.2s;
        }

            .settings-icon:hover {
                opacity: 1;
                color: #f39c12;
                transform: rotate(45deg);
            }

        /* UPLOAD BEREICH */
        .upload-box {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .upload-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
        }

        .btn-upload {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

            .btn-upload:hover {
                background: #27ae60;
                transform: scale(1.05);
            }

        .camera-icon {
            font-size: 28px;
            cursor: pointer;
            opacity: 0.8;
            transition: 0.2s;
        }

            .camera-icon:hover {
                opacity: 1;
                transform: scale(1.2);
            }

        /* --- MODAL --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
        }

        .modal-content {
            background: #1b4f72;
            margin: 5% auto;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            color: white;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

            .user-item:hover {
                background: rgba(255, 255, 255, 0.1);
            }

            .user-item input {
                margin-right: 15px;
                width: 20px;
                height: 20px;
            }

        .btn-modal {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">🎓 Spicker Informatik</div>
        <div class="nav-links" id="nav-links-container">
            <a href="start.html">Start</a>
            <a href="chat.html">Chat 💬</a>
            <a href="profil.html" id="user-link-wrapper">
                <span id="user-display" class="user-display">Lade...</span>
            </a>
            <a href="#" id="logout-link" class="logout-btn">Abmelden</a>
        </div>
    </nav>

    <div class="container">
        <div class="glass-card">
            <h1 id="subject-name" style="text-align:center; margin-bottom: 30px;">Lade Fach...</h1>

            <div id="exam-list"></div>

            <div class="upload-box">
                <h3>Altklausur oder Foto hochladen</h3>
                <div class="upload-controls">
                    <input type="file" id="upload-file" hidden>
                    <input type="file" id="camera-file" hidden accept="image/*" capture="environment">
                    <button class="btn-upload" id="btn-pick-file">📎 Datei wählen</button>
                    <span class="camera-icon" id="btn-pick-camera" title="Foto aufnehmen">📷</span>
                </div>
                <p id="status" style="margin-top:15px; font-size:14px; color: #f1c40f;"></p>
            </div>
        </div>
    </div>

    <!-- MODAL FÜR ZUGRIFFSSTEUERUNG -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Zugriff verwalten</h2>
            <div id="user-list-container"></div>
            <div style="margin-top: 25px; text-align: right; display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn-modal" id="btn-modal-cancel" style="background:#7f8c8d; color:white;">Abbrechen</button>
                <button id="save-access-btn" class="btn-modal" style="background:#27ae60; color:white;">Speichern</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, onSnapshot, addDoc, updateDoc, getDocs, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Google Apps Script Web-App (Drive-Backend)
        const DRIVE_API_URL = "https://script.google.com/macros/s/AKfycbw_clm-Ei6erUblk_rHP2fj1Q3x62BpZXBhYwLMGNUgwdjMABr3Jv953EWvWwchfKm2/exec";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const MAX_FILE_BYTES = 20 * 1024 * 1024;

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const subjectId = new URLSearchParams(window.location.search).get("id");

        let examUnsubscribers = [];

        const statusEl = document.getElementById("status");
        const examList = document.getElementById("exam-list");

        // ---------- Hilfsfunktionen ----------
        const HTML_ESCAPE = {
            "&": "&", "<": "<", ">": ">", "\"": """, "'": "'" };

            function escapeHtml(value) {
                    return String(value || "").replace(/[&<>"']/g, function (c) {
                        return HTML_ESCAPE[c];
                    });
                }

            function toBase64(file) {
                return new Promise(function (resolve, reject) {
                    const reader = new FileReader();
                    reader.onload = function () {
                        resolve(String(reader.result).split(",")[1]);
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

        // ---------- Drive-Hilfsfunktionen ----------
        async function callDrive(payload) {
            const idToken = await auth.currentUser.getIdToken();
            const res = await fetch(DRIVE_API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(Object.assign({}, payload, { idToken: idToken }))
            });
            const text = await res.text();
            let data;
            try {
                data = JSON.parse(text);
            } catch (parseError) {
                throw new Error("Keine JSON-Antwort (HTTP " + res.status + "): " + text.slice(0, 200));
            }
            if (!data.ok) {
                throw new Error("Apps Script: " + data.error);
            }
            return data;
        }

        async function syncDriveAccess(coll, id, visibility, emails) {
            const snap = await getDoc(doc(db, coll, id));
            const data = snap.data() || {};
            if (data.driveFileId) {
                await callDrive({
                    action: "setAccess",
                    fileId: data.driveFileId,
                    visibility: visibility,
                    allowedEmails: emails
                });
            }
        }

        // ---------- Navigation ----------
        function addNavLink(href, label) {
            const a = document.createElement("a");
            a.href = href;
            a.textContent = label;
            document.getElementById("nav-links-container")
                .insertBefore(a, document.getElementById("user-link-wrapper"));
        }

        document.getElementById("logout-link").addEventListener("click", function (e) {
            e.preventDefault();
            signOut(auth).then(function () {
                window.location.href = "login.html";
            });
        });

        // ---------- Auth & Seite ----------
        onAuthStateChanged(auth, async function (user) {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            const userDoc = await getDoc(doc(db, "users", user.uid));
            const userData = userDoc.data();
            if (!userData) {
                statusEl.textContent = "❌ Kein Nutzerprofil gefunden. Bitte wende dich an einen Admin.";
                return;
            }

            document.getElementById("user-display").textContent = userData.name || user.email;

            if (userData.isAdmin) {
                addNavLink("admin.html", "Admin");
            } else {
                addNavLink("help.html", "Hilfe ❓");
            }
            addNavLink("prof.html", "Professoren");

            loadSubjectDetails(user.email, !!userData.isAdmin);
        });

        async function loadSubjectDetails(userEmail, isAdmin) {
            if (!subjectId) {
                document.getElementById("subject-name").textContent = "Kein Fach ausgewählt";
                return;
            }

            const sDoc = await getDoc(doc(db, "subjects", subjectId));
            if (sDoc.exists()) {
                document.getElementById("subject-name").textContent = sDoc.data().name;
            }

            const examsRef = collection(db, "exams");
            const email = (userEmail || "").toLowerCase();

            // Alte Listener abmelden, falls die Funktion erneut aufgerufen wird
            examUnsubscribers.forEach(function (unsub) { unsub(); });
            examUnsubscribers = [];

            // Admins sehen alles. Studierende bekommen getrennte Abfragen,
            // damit die Firestore-Regeln jede Abfrage eindeutig prüfen können.
            let queries;
            if (isAdmin) {
                queries = [query(examsRef, where("subjectId", "==", subjectId))];
            } else {
                queries = [query(examsRef,
                    where("subjectId", "==", subjectId),
                    where("visibility", "==", "alle"))];
                if (email) {
                    queries.push(query(examsRef,
                        where("subjectId", "==", subjectId),
                        where("visibility", "==", "benutzerdefiniert"),
                        where("allowedEmails", "array-contains", email)));
                }
            }

            const results = queries.map(function () { return []; });

            function renderExams() {
                const exams = new Map();
                results.forEach(function (docs) {
                    docs.forEach(function (d) { exams.set(d.id, d); });
                });
                examList.innerHTML = "";

                if (exams.size === 0) {
                    examList.innerHTML = '<p style="text-align:center; opacity:0.5;">Noch keine Klausuren hochgeladen.</p>';
                    return;
                }

                exams.forEach(function (d) {
                    const exam = d.data();
                    const visibility = exam.visibility || "alle";

                    let statusText = "";
                    let statusColor = "rgba(255,255,255,0.5)";
                    if (visibility === "alle") {
                        statusText = "🔓 Alle";
                    } else if (visibility === "niemand") {
                        statusText = "🔒 Nur Admins";
                        statusColor = "#e74c3c";
                    } else if (visibility === "benutzerdefiniert") {
                        statusText = "👥 Benutzerdefiniert";
                        statusColor = "#3498db";
                    }

                    const item = document.createElement("div");
                    item.className = "exam-item";
                    item.innerHTML =
                        '<div style="display:flex; flex-direction:column; gap:4px;">' +
                        '<span style="font-weight:500;">📄 ' + escapeHtml(exam.fileName) + '</span>' +
                        '<span style="font-size:0.75rem; color:' + statusColor + '; font-weight:bold;">' + statusText + '</span>' +
                        '</div>' +
                        '<div class="exam-actions" style="display:flex; align-items:center; gap:15px;">' +
                        '<a href="' + escapeHtml(exam.url) + '" target="_blank" rel="noopener" style="color:#2ecc71; font-weight:bold; text-decoration:none;">Öffnen</a>' +
                        '</div>';

                    // Zahnrad nur für Admins. Name und Daten werden über dataset gesetzt,
                    // dadurch sind keine Anführungszeichen-Probleme möglich.
                    if (isAdmin) {
                        const gear = document.createElement("span");
                        gear.className = "settings-icon";
                        gear.title = "Einstellungen";
                        gear.textContent = "⚙️";
                        gear.dataset.id = d.id;
                        gear.dataset.name = exam.fileName || "";
                        gear.dataset.vis = visibility;
                        item.querySelector(".exam-actions").appendChild(gear);
                    }

                    examList.appendChild(item);
                });
            }

            queries.forEach(function (q, i) {
                const unsub = onSnapshot(q, function (snapshot) {
                    results[i] = snapshot.docs;
                    renderExams();
                }, function (err) {
                    statusEl.textContent = "❌ Klausuren konnten nicht geladen werden: " + err.message;
                });
                examUnsubscribers.push(unsub);
            });
        }

        // Ein Listener für alle Zahnräder (Event-Delegation)
        examList.addEventListener("click", function (e) {
            const gear = e.target.closest ? e.target.closest(".settings-icon") : null;
            if (!gear) return;
            e.stopPropagation();
            window.manageVisibility("exams", gear.dataset.id, gear.dataset.name, gear.dataset.vis);
        });

        // ---------- Upload über Google Drive ----------
        async function handleUpload(file) {
            if (!file || !subjectId) return;
            if (file.size > MAX_FILE_BYTES) {
                statusEl.textContent = "❌ Datei ist größer als 20 MB.";
                return;
            }
            statusEl.textContent = "🚀 Upload läuft...";
            try {
                // Fach laden und Drive-Ordner holen oder anlegen
                const subjRef = doc(db, "subjects", subjectId);
                const subjSnap = await getDoc(subjRef);
                if (!subjSnap.exists()) {
                    throw new Error("Fach nicht gefunden.");
                }
                const subjData = subjSnap.data();

                let folderId = subjData.driveFolderId;
                if (!folderId) {
                    const created = await callDrive({
                        action: "createFolder",
                        name: subjData.name || subjectId
                    });
                    folderId = created.folderId;
                    try {
                        await updateDoc(subjRef, { driveFolderId: folderId });
                    } catch (saveErr) {
                        throw new Error("Ordner wurde angelegt, aber das Fach konnte nicht gespeichert werden (Firestore-Regel für subjects prüfen): " + saveErr.message);
                    }
                }

                // Datei in Drive hochladen
                const base64 = await toBase64(file);
                const uploaded = await callDrive({
                    action: "upload",
                    folderId: folderId,
                    fileName: file.name,
                    mimeType: file.type || "application/octet-stream",
                    base64: base64,
                    visibility: "alle",
                    allowedEmails: []
                });

                // Metadaten in Firestore speichern
                await addDoc(collection(db, "exams"), {
                    subjectId: subjectId,
                    fileName: file.name,
                    url: uploaded.previewUrl,
                    driveFileId: uploaded.fileId,
                    visibility: "alle",
                    allowedEmails: [],
                    uploadedBy: auth.currentUser.uid,
                    createdAt: serverTimestamp()
                });

                statusEl.textContent = "✅ Erfolgreich hochgeladen!";
                setTimeout(function () { statusEl.textContent = ""; }, 3000);
            } catch (e) {
                console.error("Upload-Fehler:", e);
                statusEl.textContent = "❌ Fehler: " + e.message;
            }
        }

        const uploadInput = document.getElementById("upload-file");
        const cameraInput = document.getElementById("camera-file");

        document.getElementById("btn-pick-file").addEventListener("click", function () {
            uploadInput.click();
        });
        document.getElementById("btn-pick-camera").addEventListener("click", function () {
            cameraInput.click();
        });

        function onFileChosen(input) {
            const file = input.files[0];
            input.value = ""; // dieselbe Datei kann danach erneut gewählt werden
            handleUpload(file);
        }
        uploadInput.addEventListener("change", function () { onFileChosen(uploadInput); });
        cameraInput.addEventListener("change", function () { onFileChosen(cameraInput); });

        // ---------- Verwaltung (nur Admins) ----------
        window.manageVisibility = async function (coll, id, name, currentVis) {
            // Aktuelle Daten frisch aus Firestore holen
            const docSnap = await getDoc(doc(db, coll, id));
            const currentData = docSnap.exists() ? docSnap.data() : {};
            const currentEmails = currentData.allowedEmails || [];

            const defaultMode = currentVis === "alle" ? "1" : (currentVis === "niemand" ? "2" : "3");
            const mode = prompt(
                "Aktion für \"" + name + "\":\n" +
                "1 = Alle (Jeder kann es sehen)\n" +
                "2 = Nur Admins (Gesperrt)\n" +
                "3 = Benutzerdefiniert (Nutzer auswählen)\n" +
                "4 = LÖSCHEN 🗑️",
                defaultMode
            );
            if (!mode) return;

            if (mode === "4") {
                if (confirm("Möchtest du \"" + name + "\" wirklich unwiderruflich löschen?")) {
                    // Datei in Drive in den Papierkorb verschieben
                    if (currentData.driveFileId) {
                        await callDrive({ action: "delete", fileId: currentData.driveFileId });
                    }
                    await deleteDoc(doc(db, coll, id));
                }
                return;
            }

            if (mode === "1" || mode === "2") {
                const vis = mode === "1" ? "alle" : "niemand";
                await updateDoc(doc(db, coll, id), { visibility: vis, allowedEmails: [] });
                await syncDriveAccess(coll, id, vis, []);
                return;
            }

            if (mode === "3") {
                const modal = document.getElementById("userModal");
                const container = document.getElementById("user-list-container");
                document.getElementById("modal-title").textContent = "Zugriff für \"" + name + "\"";
                modal.style.display = "block";
                container.innerHTML = "<p>Lade Nutzerliste...</p>";

                const usersSnap = await getDocs(collection(db, "users"));
                container.innerHTML = "";
                usersSnap.forEach(function (uDoc) {
                    const u = uDoc.data();
                    const email = (u.email || "").toLowerCase();
                    if (!email) return; // Nutzer ohne E-Mail können nicht freigegeben werden

                    const row = document.createElement("div");
                    row.className = "user-item";

                    const checkbox = document.createElement("input");
                    checkbox.type = "checkbox";
                    checkbox.value = email;
                    checkbox.checked = currentEmails.indexOf(email) !== -1;

                    const label = document.createElement("span");
                    label.textContent = (u.name || email) + " (" + email + ")";

                    row.appendChild(checkbox);
                    row.appendChild(label);
                    row.addEventListener("click", function (e) {
                        if (e.target !== checkbox) {
                            checkbox.checked = !checkbox.checked;
                        }
                    });
                    container.appendChild(row);
                });

                document.getElementById("save-access-btn").onclick = async function () {
                    const selected = Array.from(container.querySelectorAll("input:checked")).map(function (cb) {
                        return cb.value;
                    });
                    await updateDoc(doc(db, coll, id), {
                        visibility: "benutzerdefiniert",
                        allowedEmails: selected
                    });
                    await syncDriveAccess(coll, id, "benutzerdefiniert", selected);
                    closeModal();
                };
            }
        };

        function closeModal() {
            document.getElementById("userModal").style.display = "none";
        }
        document.getElementById("btn-modal-cancel").addEventListener("click", closeModal);
    </script>
</body>
</html>
