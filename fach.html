<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fachdetails – Spicker Informatik</title>
    <style>
        [hidden] {
            display: none !important;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80') no-repeat center fixed;
            background-size: cover;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* --- NAVBAR --- */
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 0 40px;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .nav-brand {
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

            .nav-links a {
                color: white;
                text-decoration: none;
                font-weight: 500;
                opacity: 0.8;
                transition: 0.3s;
                font-size: 0.95rem;
                white-space: nowrap;
            }

                .nav-links a:hover {
                    opacity: 1;
                }

        .user-display {
            opacity: 0.7;
            font-size: 0.9rem;
            color: white;
            font-weight: bold;
        }

        .logout-btn {
            opacity: 0.5;
            font-size: 0.9rem;
            cursor: pointer;
            color: white;
            text-decoration: none;
        }
        /* --- CONTENT --- */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
            box-sizing: border-box;
            width: 100%;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #exam-list {
            text-align: left;
            margin-top: 20px;
        }

        .exam-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            transition: 0.2s;
        }

            .exam-item:hover {
                background: rgba(255, 255, 255, 0.15);
            }

        .exam-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .exam-name {
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .exam-vis {
            font-size: 0.75rem;
            font-weight: bold;
        }

        .exam-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0;
        }

        .open-link {
            color: #2ecc71;
            font-weight: bold;
            text-decoration: none;
        }

        .settings-icon {
            cursor: pointer;
            opacity: 0.5;
            font-size: 1.1rem;
            transition: 0.2s;
        }

            .settings-icon:hover {
                opacity: 1;
                color: #f39c12;
                transform: rotate(45deg);
            }

        .empty-text {
            text-align: center;
            opacity: 0.5;
        }
        /* UPLOAD BEREICH */
        .upload-box {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .upload-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
        }

        .btn-upload {
            display: inline-block;
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            user-select: none;
        }

            .btn-upload:hover {
                background: #27ae60;
                transform: scale(1.05);
            }

        .camera-icon {
            display: inline-block;
            font-size: 28px;
            cursor: pointer;
            opacity: 0.8;
            transition: 0.2s;
            user-select: none;
        }

            .camera-icon:hover {
                opacity: 1;
                transform: scale(1.2);
            }

        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #f1c40f;
            min-height: 1.2em;
            word-break: break-word;
        }
        /* --- MODAL --- */
        .modal {
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
        }

        .modal-content {
            background: #1b4f72;
            margin: 5% auto;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            color: white;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-sizing: border-box;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
        }

            .user-item:hover {
                background: rgba(255, 255, 255, 0.1);
            }

            .user-item input {
                margin-right: 15px;
                width: 20px;
                height: 20px;
            }

        .btn-modal {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🎓 Spicker Informatik</div>
        <div class="nav-links" id="nav-links-container">
            <a href="start.html">Start</a>
            <a href="chat.html">Chat 💬</a>
            <a href="profil.html" id="user-link-wrapper">
                <span id="user-display" class="user-display">Lade...</span>
            </a>
            <a href="#" id="logout-link" class="logout-btn">Abmelden</a>
        </div>
    </nav>
    <div class="container">
        <div class="glass-card">
            <h1 id="subject-name" style="text-align:center; margin-bottom: 30px;">Lade Fach...</h1>
            <div id="exam-list"></div>
            <div class="upload-box">
                <h3>Altklausur oder Foto hochladen</h3>
                <div class="upload-controls">
                    <input type="file" id="upload-file" hidden>
                    <input type="file" id="camera-file" accept="image/*" capture="environment" hidden>
                    <label for="upload-file" class="btn-upload">📎 Datei wählen</label>
                    <label for="camera-file" class="camera-icon" title="Foto aufnehmen">📷</label>
                </div>
                <p id="status" class="status"></p>
            </div>
        </div>
    </div>
    <!-- MODAL FÜR ZUGRIFFSSTEUERUNG (nur Admins) -->
    <div id="userModal" class="modal" hidden>
        <div class="modal-content">
            <h2 id="modal-title">Zugriff verwalten</h2>
            <div id="user-list-container"></div>
            <div style="margin-top: 25px; display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn-modal" id="btn-modal-cancel" style="background:#7f8c8d;">Abbrechen</button>
                <button class="btn-modal" id="save-access-btn" style="background:#27ae60;">Speichern</button>
            </div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, onSnapshot, addDoc, updateDoc, getDocs, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        // ---------- Konfiguration ----------
        const DRIVE_API_URL = "https://script.google.com/macros/s/AKfycbw_clm-Ei6erUblk_rHP2fj1Q3x62BpZXBhYwLMGNUgwdjMABr3Jv953EWvWwchfKm2/exec";
        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };
        const MAX_FILE_BYTES = 20 * 1024 * 1024;
        // ---------- Initialisierung ----------
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const subjectId = new URLSearchParams(window.location.search).get("id");
        const statusEl = document.getElementById("status");
        const examList = document.getElementById("exam-list");
        const uploadInput = document.getElementById("upload-file");
        const cameraInput = document.getElementById("camera-file");
        const modal = document.getElementById("userModal");
        const modalContainer = document.getElementById("user-list-container");
        let examUnsubscribers = [];
        let isAdminUser = false;
        window.addEventListener("error", function (e) {
            statusEl.textContent = "❌ Skriptfehler: " + e.message;
        });
        function showStatus(text) {
            statusEl.textContent = text;
        }
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }
        function readAsBase64(file) {
            return new Promise(function (resolve, reject) {
                const reader = new FileReader();
                reader.onload = function () {
                    const parts = String(reader.result).split(",");
                    resolve(parts[1] || "");
                };
                reader.onerror = function () { reject(new Error("Datei konnte nicht gelesen werden.")); };
                reader.readAsDataURL(file);
            });
        }
        async function callDrive(payload) {
            if (!auth.currentUser) {
                throw new Error("Nicht angemeldet.");
            }
            const idToken = await auth.currentUser.getIdToken();
            const res = await fetch(DRIVE_API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(Object.assign({}, payload, { idToken: idToken }))
            });
            const text = await res.text();
            let data;
            try {
                data = JSON.parse(text);
            } catch (parseError) {
                throw new Error("Keine JSON-Antwort (HTTP " + res.status + "): " + text.slice(0, 200));
            }
            if (!data.ok) {
                throw new Error("Apps Script: " + data.error);
            }
            return data;
        }
        async function syncDriveAccess(coll, id, visibility, emails) {
            const snap = await getDoc(doc(db, coll, id));
            const data = snap.data() || {};
            if (data.driveFileId) {
                await callDrive({
                    action: "setAccess",
                    fileId: data.driveFileId,
                    visibility: visibility,
                    allowedEmails: emails
                });
            }
        }
        function addNavLink(href, label) {
            const a = el("a", null, label);
            a.href = href;
            document.getElementById("nav-links-container")
                .insertBefore(a, document.getElementById("user-link-wrapper"));
        }
        document.getElementById("logout-link").addEventListener("click", function (e) {
            e.preventDefault();
            signOut(auth).then(function () {
                window.location.href = "login.html";
            });
        });
        onAuthStateChanged(auth, async function (user) {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            const userData = userDoc.data();
            if (!userData) {
                showStatus("❌ Kein Nutzerprofil gefunden. Bitte wende dich an einen Admin.");
                return;
            }
            isAdminUser = !!userData.isAdmin;
            document.getElementById("user-display").textContent = userData.name || user.email;
            if (isAdminUser) {
                addNavLink("admin.html", "Admin");
            } else {
                addNavLink("help.html", "Hilfe ❓");
            }
            addNavLink("prof.html", "Professoren");
            if (!subjectId) {
                document.getElementById("subject-name").textContent = "Kein Fach ausgewählt";
                return;
            }
            loadSubject(user.email);
        });
        async function loadSubject(userEmail) {
            const sDoc = await getDoc(doc(db, "subjects", subjectId));
            if (sDoc.exists()) {
                document.getElementById("subject-name").textContent = sDoc.data().name || "Fach";
            } else {
                document.getElementById("subject-name").textContent = "Fach nicht gefunden";
            }
            const examsRef = collection(db, "exams");
            const email = (userEmail || "").toLowerCase();
            examUnsubscribers.forEach(function (unsub) { unsub(); });
            examUnsubscribers = [];
            let queries;
            if (isAdminUser) {
                queries = [query(examsRef, where("subjectId", "==", subjectId))];
            } else {
                queries = [query(examsRef,
                    where("subjectId", "==", subjectId),
                    where("visibility", "==", "alle"))];
                if (email) {
                    queries.push(query(examsRef,
                        where("subjectId", "==", subjectId),
                        where("visibility", "==", "benutzerdefiniert"),
                        where("allowedEmails", "array-contains", email)));
                }
            }
            const results = queries.map(function () { return []; });
            function renderExams() {
                const exams = new Map();
                results.forEach(function (docs) {
                    docs.forEach(function (d) { exams.set(d.id, d); });
                });
                examList.textContent = "";
                if (exams.size === 0) {
                    examList.appendChild(el("p", "empty-text", "Noch keine Klausuren hochgeladen."));
                    return;
                }
                exams.forEach(function (d) {
                    const exam = d.data();
                    const visibility = exam.visibility || "alle";
                    let statusText = "🔓 Alle";
                    let statusColor = "rgba(255,255,255,0.5)";
                    if (visibility === "niemand") {
                        statusText = "🔒 Nur Admins";
                        statusColor = "#e74c3c";
                    } else if (visibility === "benutzerdefiniert") {
                        statusText = "👥 Benutzerdefiniert";
                        statusColor = "#3498db";
                    }
                    const item = el("div", "exam-item");
                    const info = el("div", "exam-info");
                    info.appendChild(el("span", "exam-name", "📄 " + (exam.fileName || "Unbenannt")));
                    const visLabel = el("span", "exam-vis", statusText);
                    visLabel.style.color = statusColor;
                    info.appendChild(visLabel);
                    const actions = el("div", "exam-actions");
                    if (exam.url && /^https:\/\//.test(exam.url)) {
                        const link = el("a", "open-link", "Öffnen");
                        link.href = exam.url;
                        link.target = "_blank";
                        link.rel = "noopener";
                        actions.appendChild(link);
                    }
                    if (isAdminUser) {
                        const gear = el("span", "settings-icon", "⚙️");
                        gear.title = "Einstellungen";
                        gear.addEventListener("click", function () {
                            manageExam(d.id, exam.fileName || "", visibility);
                        });
                        actions.appendChild(gear);
                    }
                    item.appendChild(info);
                    item.appendChild(actions);
                    examList.appendChild(item);
                });
            }
            queries.forEach(function (q, i) {
                const unsub = onSnapshot(q, function (snapshot) {
                    results[i] = snapshot.docs;
                    renderExams();
                }, function (err) {
                    showStatus("❌ Klausuren konnten nicht geladen werden: " + err.message);
                });
                examUnsubscribers.push(unsub);
            });
        }
        // ---------- AUTOMATISCHER UPLOAD & ROBUSTE SELBSTHEILUNG ----------
        async function handleUpload(file) {
            if (!file) return;
            if (!subjectId) {
                showStatus("❌ Kein Fach ausgewählt.");
                return;
            }
            if (!auth.currentUser) {
                showStatus("❌ Nicht angemeldet.");
                return;
            }
            if (file.size > MAX_FILE_BYTES) {
                showStatus("❌ Datei ist größer als 20 MB.");
                return;
            }
            showStatus("🚀 Upload läuft...");
            try {
                const subjRef = doc(db, "subjects", subjectId);
                let subjSnap = await getDoc(subjRef);
                if (!subjSnap.exists()) {
                    throw new Error("Fach nicht gefunden.");
                }
                let subjData = subjSnap.data();
                let folderId = subjData.driveFolderId;
                async function tryUploadToDrive(fId) {
                    const base64 = await readAsBase64(file);
                    return await callDrive({
                        action: "upload",
                        folderId: fId,
                        fileName: file.name,
                        mimeType: file.type || "application/octet-stream",
                        base64: base64,
                        visibility: "alle",
                        allowedEmails: [],
                        folderName: subjData.name || subjectId
                    });
                }
                let uploaded;
                if (!folderId) {
                    showStatus("🚀 Fach-Ordner wird in Drive angelegt...");
                    const created = await callDrive({
                        action: "createFolder",
                        name: subjData.name || subjectId
                    });
                    folderId = created.folderId;
                    await updateDoc(subjRef, { driveFolderId: folderId });
                }
                showStatus("🚀 Datei wird nach Drive hochgeladen...");
                try {
                    uploaded = await tryUploadToDrive(folderId);
                } catch (firstError) {
                    const errStr = String(firstError.message || "").toLowerCase();
                    if (errStr.includes("element") || errStr.includes("id") || errStr.includes("gefunden")) {
                        showStatus("🔄 Ordner wurde in Drive vermisst – wird automatisch neu erstellt...");

                        await updateDoc(subjRef, { driveFolderId: null });
                        const created = await callDrive({
                            action: "createFolder",
                            name: subjData.name || subjectId
                        });
                        folderId = created.folderId;
                        await updateDoc(subjRef, { driveFolderId: folderId });
                        showStatus("🚀 Zweiter Upload-Versuch...");
                        uploaded = await tryUploadToDrive(folderId);
                    } else {
                        throw firstError;
                    }
                }
                // Falls das Apps Script den Ordner frisch erstellt hat, ID in Firestore speichern
                if (uploaded && uploaded.folderId) {
                    await updateDoc(subjRef, { driveFolderId: uploaded.folderId });
                }
                // Metadaten in Firestore speichern
                await addDoc(collection(db, "exams"), {
                    subjectId: subjectId,
                    fileName: file.name,
                    url: uploaded.previewUrl,
                    driveFileId: uploaded.fileId,
                    visibility: "alle",
                    allowedEmails: [],
                    uploadedBy: auth.currentUser.uid,
                    createdAt: serverTimestamp()
                });
                showStatus("✅ Erfolgreich hochgeladen!");
                setTimeout(function () { showStatus(""); }, 3000);
            } catch (e) {
                console.error("Upload-Fehler:", e);
                showStatus("❌ Fehler: " + e.message);
            }
        }
        function onFileChosen(input) {
            const file = input.files && input.files[0];
            input.value = "";
            handleUpload(file);
        }
        uploadInput.addEventListener("change", function () { onFileChosen(uploadInput); });
        cameraInput.addEventListener("change", function () { onFileChosen(cameraInput); });
        // ---------- Verwaltung (nur Admins) ----------
        async function manageExam(id, name, currentVis) {
            const docSnap = await getDoc(doc(db, "exams", id));
            const currentData = docSnap.exists() ? docSnap.data() : {};
            const currentEmails = currentData.allowedEmails || [];
            const defaultMode = currentVis === "alle" ? "1" : (currentVis === "niemand" ? "2" : "3");
            const mode = prompt(
                "Aktion für \"" + name + "\":\n" +
                "1 = Alle (Jeder kann es sehen)\n" +
                "2 = Nur Admins (Gesperrt)\n" +
                "3 = Benutzerdefiniert (Nutzer auswählen)\n" +
                "4 = LÖSCHEN 🗑️",
                defaultMode
            );
            if (!mode) return;
            try {
                if (mode === "4") {
                    if (!confirm("Möchtest du \"" + name + "\" wirklich löschen?")) return;
                    if (currentData.driveFileId) {
                        await callDrive({ action: "delete", fileId: currentData.driveFileId });
                    }
                    await deleteDoc(doc(db, "exams", id));
                    showStatus("🗑️ Gelöscht.");
                    return;
                }
                if (mode === "1" || mode === "2") {
                    const vis = mode === "1" ? "alle" : "niemand";
                    await syncDriveAccess("exams", id, vis, []);
                    await updateDoc(doc(db, "exams", id), { visibility: vis, allowedEmails: [] });
                    showStatus("✅ Sichtbarkeit gespeichert.");
                    return;
                }
                if (mode === "3") {
                    await openAccessModal(id, name, currentEmails);
                }
            } catch (e) {
                console.error("Verwaltungsfehler:", e);
                showStatus("❌ Fehler: " + e.message);
            }
        }
        async function openAccessModal(id, name, currentEmails) {
            document.getElementById("modal-title").textContent = "Zugriff für \"" + name + "\"";
            modalContainer.textContent = "";
            modalContainer.appendChild(el("p", null, "Lade Nutzerliste..."));
            modal.hidden = false;
            const usersSnap = await getDocs(collection(db, "users"));
            modalContainer.textContent = "";
            usersSnap.forEach(function (uDoc) {
                const u = uDoc.data();
                const email = (u.email || "").toLowerCase();
                if (!email) return;
                const row = el("div", "user-item");
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.value = email;
                checkbox.checked = currentEmails.indexOf(email) !== -1;
                const label = el("span", null, (u.name || email) + " (" + email + ")");
                row.appendChild(checkbox);
                row.appendChild(label);
                row.addEventListener("click", function (e) {
                    if (e.target !== checkbox) {
                        checkbox.checked = !checkbox.checked;
                    }
                });
                modalContainer.appendChild(row);
            });
            const saveBtn = document.getElementById("save-access-btn");
            const newSave = saveBtn.cloneNode(true);
            saveBtn.parentNode.replaceChild(newSave, saveBtn);
            newSave.addEventListener("click", async function () {
                try {
                    const selected = Array.from(modalContainer.querySelectorAll("input:checked")).map(function (cb) {
                        return cb.value;
                    });
                    await syncDriveAccess("exams", id, "benutzerdefiniert", selected);
                    await updateDoc(doc(db, "exams", id), {
                        visibility: "benutzerdefiniert",
                        allowedEmails: selected
                    });
                    closeModal();
                    showStatus("✅ Zugriff gespeichert.");
                } catch (e) {
                    showStatus("❌ Fehler: " + e.message);
                }
            });
        }
        function closeModal() {
            modal.hidden = true;
        }
        document.getElementById("btn-modal-cancel").addEventListener("click", closeModal);
    </script>
</body>
</html>
