<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Fachdetails – Spicker Informatik</title>
    <!-- Supabase Bibliothek -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary-blue: #1b4f72;
            --navbar-bg: rgba(255, 255, 255, 0.1);
            --hover-grey: #e9ecef;
            --text-dark: #333;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80') no-repeat center fixed;
            background-size: cover;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- NAVBAR --- */
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 0 40px;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .nav-brand {
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

            .nav-links a {
                color: white;
                text-decoration: none;
                font-weight: 500;
                opacity: 0.8;
                transition: 0.3s;
                font-size: 0.95rem;
                white-space: nowrap;
            }

                .nav-links a:hover {
                    opacity: 1;
                }

        .user-display {
            opacity: 0.7;
            font-size: 0.9rem;
            color: white;
            font-weight: bold;
        }

        .logout-btn {
            opacity: 0.5;
            font-size: 0.9rem;
            cursor: pointer;
            color: white;
            text-decoration: none;
        }

        /* --- CONTENT --- */
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #exam-list {
            text-align: left;
            margin-top: 20px;
        }

        .exam-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }

            .exam-item:hover {
                background: rgba(255, 255, 255, 0.15);
            }

        .settings-icon {
            cursor: pointer;
            opacity: 0.5;
            margin-left: 10px;
            font-size: 1.1rem;
            transition: 0.2s;
        }

            .settings-icon:hover {
                opacity: 1;
                color: #f39c12;
                transform: rotate(45deg);
            }

        /* UPLOAD BEREICH */
        .upload-box {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .upload-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 15px;
        }

        .btn-upload {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

            .btn-upload:hover {
                background: #27ae60;
                transform: scale(1.05);
            }

        .camera-icon {
            font-size: 28px;
            cursor: pointer;
            opacity: 0.8;
            transition: 0.2s;
        }

            .camera-icon:hover {
                opacity: 1;
                transform: scale(1.2);
            }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">🎓 Spicker Informatik</div>
        <div class="nav-links" id="nav-links-container">
            <a href="start.html">Start</a>
            <a href="chat.html">Chat 💬</a>
            <a href="profil.html" id="user-link-wrapper" class="user-link">
                <span id="user-display" class="user-display">Lade...</span>
            </a>
            <a href="#" onclick="logout()" class="logout-btn">Abmelden</a>
        </div>
    </nav>

    <div class="container">
        <div class="glass-card">
            <h1 id="subject-name" style="text-align:center; margin-bottom: 30px;">Lade Fach...</h1>

            <div id="exam-list"></div>

            <div class="upload-box">
                <h3>Altklausur oder Foto hochladen</h3>
                <div class="upload-controls">
                    <input type="file" id="upload-file" hidden onchange="handleUpload(this.files[0])">
                    <input type="file" id="camera-file" hidden accept="image/*" capture="environment" onchange="handleUpload(this.files[0])">
                    <button class="btn-upload" onclick="document.getElementById('upload-file').click()">📎 Datei wählen</button>
                    <span class="camera-icon" onclick="document.getElementById('camera-file').click()" title="Foto aufnehmen">📷</span>
                </div>
                <p id="status" style="margin-top:15px; font-size:14px; color: #f1c40f;"></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, onSnapshot, addDoc, updateDoc, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const SUPABASE_URL = 'https://jdbcrsczsjkjjvcbesbb.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpkYmNyc2N6c2pramp2Y2Jlc2JiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4NjY3NTgsImV4cCI6MjEwNDQ0Mjc1OH0.pa2msgQ6h042iKsAia9rRqSsL6kmwSbuWv9l38xUZ2w';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const urlParams = new URLSearchParams(window.location.search);
        const subjectId = urlParams.get('id');

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            const userData = userDoc.data();
            if (!userData) return;

            document.getElementById('user-display').textContent = userData.name;

            const navContainer = document.getElementById('nav-links-container');
            const userLinkWrapper = document.getElementById('user-link-wrapper');

            if (userData.isAdmin) {
                const adminA = document.createElement('a'); adminA.href = 'admin.html'; adminA.textContent = 'Admin';
                navContainer.insertBefore(adminA, userLinkWrapper);
            } else {
                const helpA = document.createElement('a'); helpA.href = 'help.html'; helpA.textContent = 'Hilfe ❓';
                navContainer.insertBefore(helpA, userLinkWrapper);
            }

            const profA = document.createElement('a'); profA.href = 'prof.html'; profA.textContent = 'Professoren';
            navContainer.insertBefore(profA, userLinkWrapper);

            loadSubjectDetails(user.email, userData.isAdmin);
        });

        async function loadSubjectDetails(userEmail, isAdmin) {
            if (!subjectId) return;
            const sDoc = await getDoc(doc(db, "subjects", subjectId));
            if (sDoc.exists()) document.getElementById('subject-name').textContent = sDoc.data().name;

            onSnapshot(query(collection(db, "exams"), where("subjectId", "==", subjectId)), (snapshot) => {
                const list = document.getElementById('exam-list');
                list.innerHTML = "";
                if (snapshot.empty) {
                    list.innerHTML = '<p style="text-align:center; opacity:0.5;">Noch keine Klausuren hochgeladen.</p>';
                }
                snapshot.forEach((d) => {
                    const exam = d.data();
                    const visibility = exam.visibility || 'alle';
                    const allowedEmails = exam.allowedEmails || [];

                    if (isAdmin || visibility === 'alle' || (visibility === 'benutzerdefiniert' && allowedEmails.includes(userEmail.toLowerCase()))) {

                        // --- NEU: STATUS LOGIK FÜR DIE ANZEIGE ---
                        let statusText = "";
                        let statusColor = "rgba(255,255,255,0.5)";

                        if (visibility === 'alle') {
                            statusText = "🔓 Alle";
                        } else if (visibility === 'niemand') {
                            statusText = "🔒 Nur Admins";
                            statusColor = "#e74c3c";
                        } else if (visibility === 'benutzerdefiniert') {
                            statusText = `👥 ${allowedEmails.length > 0 ? allowedEmails.join(', ') : 'Bestimmte User'}`;
                            statusColor = "#3498db";
                        }

                        const item = document.createElement('div');
                        item.className = 'exam-item';
                        item.innerHTML = `
                                    <div style="display:flex; flex-direction:column; gap:4px;">
                                        <span style="font-weight:500;">📄 ${exam.fileName}</span>
                                        <span style="font-size: 0.75rem; color: ${statusColor}; font-weight: bold;">
                                            ${statusText}
                                        </span>
                                    </div>
                                    <div style="display:flex; align-items:center; gap:15px;">
                                        <a href="${exam.url}" target="_blank" style="color:#2ecc71; font-weight:bold; text-decoration:none;">Download</a>
                                        ${isAdmin ? `<span class="settings-icon" onclick="manageVisibility('exams', '${d.id}', '${exam.fileName}', '${visibility}', ${JSON.stringify(allowedEmails)}, '${exam.storagePath || ''}')">⚙️</span>` : ''}
                                    </div>`;
                        list.appendChild(item);
                    }
                });
            });
        }

        window.handleUpload = async (file) => {
            if (!file || !subjectId) return;
            const status = document.getElementById('status');
            status.textContent = "🚀 Upload läuft...";
            try {
                const fileName = `${Date.now()}_${file.name}`;
                const filePath = `${subjectId}/${fileName}`;
                const { error } = await supabase.storage.from('exams').upload(filePath, file);
                if (error) throw error;
                const { data: urlData } = supabase.storage.from('exams').getPublicUrl(filePath);
                await addDoc(collection(db, "exams"), {
                    subjectId, fileName: file.name, url: urlData.publicUrl, storagePath: filePath,
                    status: 'approved', visibility: 'alle', allowedEmails: [],
                    uploadedBy: auth.currentUser.uid, createdAt: serverTimestamp()
                });
                status.textContent = "✅ Fertig!";
                setTimeout(() => status.textContent = "", 3000);
            } catch (e) { status.textContent = "❌ Fehler: " + e.message; }
        };

        window.manageVisibility = async (coll, id, name, currentVis, currentEmails, storagePath) => {
            const mode = prompt(
                `Aktion für "${name}":\n` +
                `1 = Alle (Jeder kann es sehen)\n` +
                `2 = Nur Admins (Gesperrt für Studenten)\n` +
                `3 = Benutzerdefiniert (Nur bestimmte E-Mails)\n` +
                `4 = LÖSCHEN 🗑️`,
                currentVis === 'alle' ? "1" : (currentVis === 'niemand' ? "2" : "3")
            );

            if (mode === "4") {
                if (confirm(`Möchtest du "${name}" wirklich unwiderruflich löschen?`)) {
                    if (storagePath) await supabase.storage.from('exams').remove([storagePath]);
                    await deleteDoc(doc(db, coll, id));
                }
            } else if (mode === "1") {
                await updateDoc(doc(db, coll, id), { visibility: 'alle', allowedEmails: [] });
            } else if (mode === "2") {
                await updateDoc(doc(db, coll, id), { visibility: 'niemand', allowedEmails: [] });
            } else if (mode === "3") {
                // NEU: E-Mail Eingabe für benutzerdefinierten Zugriff
                const emailsInput = prompt("Gib die E-Mails der Personen ein, die Zugriff haben sollen (mit Komma getrennt):", currentEmails.join(', '));
                if (emailsInput !== null) {
                    const emailArray = emailsInput.split(',').map(e => e.trim().toLowerCase()).filter(e => e !== "");
                    await updateDoc(doc(db, coll, id), {
                        visibility: 'benutzerdefiniert',
                        allowedEmails: emailArray
                    });
                }
            }
        };

        window.logout = () => signOut(auth).then(() => location.href = 'login.html');
    </script>
</body>
</html>
