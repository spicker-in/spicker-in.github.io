<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fachdetails – SpickerSeite</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80') no-repeat center fixed;
            background-size: cover;
            color: white;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .admin-btn {
            display: none;
            color: #ffeb3b !important;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .exam-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-download {
            background: #2ecc71;
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 10px;
            font-weight: bold;
        }

        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 10px;
            cursor: pointer;
            display: none;
        }

        /* UPLOAD BOX IN FACH.HTML */
        .upload-box {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .btn-upload {
            background: linear-gradient(135deg, #5dade2, #2e86c1);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div style="font-size: 20px; font-weight: bold;">🎓 Informatik</div>
        <div class="nav-links">
            <span id="user-name">...</span>
            <a href="start.html" style="color: #5dade2;">🏠 Startseite</a>
            <a href="admin.html" class="admin-btn" id="admin-link">🛠 Admin</a>
            <a onclick="logout()">Abmelden</a>
        </div>
    </nav>

    <div class="container">
        <div class="glass-card">
            <h1 id="subject-name">Lade Fach...</h1>
            <div id="exam-list"></div>

            <!-- Upload Bereich hierher verschoben -->
            <div class="upload-box">
                <h3>Altklausur für dieses Fach hochladen</h3>
                <input type="file" id="upload-file" accept="application/pdf">
                <button class="btn-upload" onclick="handleUpload()">Hochladen</button>
                <p id="status"></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, onSnapshot, deleteDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = { /* Deine Config */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const urlParams = new URLSearchParams(window.location.search);
        const subjectId = urlParams.get('id');

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists()) {
                const data = userDoc.data();
                document.getElementById('user-name').textContent = data.name;
                if (data.isAdmin) document.getElementById('admin-link').style.display = 'inline';
                loadSubjectDetails(data.isAdmin);
            }
        });

        async function loadSubjectDetails(isAdmin) {
            const sDoc = await getDoc(doc(db, "subjects", subjectId));
            if (sDoc.exists()) document.getElementById('subject-name').textContent = sDoc.data().name;

            const q = query(collection(db, "exams"), where("subjectId", "==", subjectId));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('exam-list');
                list.innerHTML = snapshot.empty ? '<p style="text-align:center; opacity:0.6;">Keine Klausuren vorhanden.</p>' : "";
                snapshot.forEach((d) => {
                    const exam = d.data();
                    const item = document.createElement('div');
                    item.className = 'exam-item';
                    item.innerHTML = `<span>📄 ${exam.fileName}</span>
                            <div><a href="${exam.url}" target="_blank" class="btn-download">Download</a>
                            <button class="btn-delete" id="del-${d.id}" onclick="deleteExam('${d.id}')">Löschen</button></div>`;
                    list.appendChild(item);
                    if (isAdmin) document.getElementById(`del-${d.id}`).style.display = 'inline-block';
                });
            });
        }

        window.handleUpload = async () => {
            const file = document.getElementById('upload-file').files[0];
            const status = document.getElementById('status');
            if (!file || !subjectId) return alert("Datei auswählen!");

            status.textContent = "Upload läuft...";
            try {
                const sRef = ref(storage, `exams/${subjectId}/${Date.now()}_${file.name}`);
                const snap = await uploadBytes(sRef, file);
                const url = await getDownloadURL(snap.ref);
                await addDoc(collection(db, "exams"), {
                    subjectId: subjectId, fileName: file.name, url: url,
                    uploadedBy: auth.currentUser.uid, createdAt: serverTimestamp()
                });
                status.textContent = "Erfolg!";
                document.getElementById('upload-file').value = "";
            } catch (e) { status.textContent = "Fehler beim Upload."; }
        };

        window.deleteExam = async (id) => {
            if (confirm("Löschen?")) await deleteDoc(doc(db, "exams", id));
        };

        window.logout = () => signOut(auth).then(() => location.href = 'login.html');
    </script>
</body>
</html>
