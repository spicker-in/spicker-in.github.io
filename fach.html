<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Fachdetails – Spicker Informatik</title>
    <style>
        :root {
            --primary-blue: #1b4f72;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: url('https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80') no-repeat center fixed;
            background-size: cover;
            color: white;
            min-height: 100vh;
        }

        /* EINHEITLICHE NAVBAR */
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            padding: 0 40px;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            box-sizing: border-box;
        }

        .nav-brand {
            font-weight: bold;
            font-size: 1.2rem;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

            .nav-links a {
                color: white;
                text-decoration: none;
                font-weight: 500;
                opacity: 0.8;
                transition: 0.3s;
                font-size: 0.95rem;
            }

                .nav-links a:hover {
                    opacity: 1;
                }

        .user-link {
            text-decoration: none;
            transition: 0.3s;
            margin-left: 10px;
        }

            .user-link:hover .user-display {
                opacity: 1;
                text-decoration: underline;
            }

        .user-display {
            opacity: 0.7;
            font-size: 0.9rem;
            color: white;
            font-weight: bold;
        }

        .logout-btn {
            opacity: 0.5;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .exam-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 5px;
            background: #f39c12;
            margin-left: 10px;
        }

        .upload-box {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .upload-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
        }

        .btn-upload {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
        }

        .camera-icon {
            font-size: 24px;
            cursor: pointer;
            opacity: 0.8;
            transition: 0.2s;
        }

            .camera-icon:hover {
                opacity: 1;
                transform: scale(1.1);
            }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">🎓 Fachdetails</div>
        <div class="nav-links" id="nav-links-container">
            <a href="start.html">Start</a>
            <a href="chat.html">Chat 💬</a>
            <a href="profil.html" id="user-link-wrapper" class="user-link">
                <span id="user-display" class="user-display">Lade...</span>
            </a>
            <a href="#" onclick="logout()" class="logout-btn">Abmelden</a>
        </div>
    </nav>

    <div class="container">
        <div class="glass-card">
            <h1 id="subject-name" style="text-align:center">Lade Fach...</h1>
            <div id="exam-list"></div>

            <div class="upload-box">
                <h3>Altklausur hochladen</h3>
                <div class="upload-controls">
                    <input type="file" id="upload-file" hidden onchange="handleUpload(this.files[0])">
                    <input type="file" id="camera-file" hidden accept="image/*" capture="environment" onchange="handleUpload(this.files[0])">

                    <button class="btn-upload" onclick="document.getElementById('upload-file').click()">📎 Datei wählen</button>
                    <span class="camera-icon" onclick="document.getElementById('camera-file').click()">📷</span>
                </div>
                <p id="status" style="margin-top:10px; font-size:14px;"></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, query, where, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = { /* Deine Config */ };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        const urlParams = new URLSearchParams(window.location.search);
        const subjectId = urlParams.get('id');

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            const userDoc = await getDoc(doc(db, "users", user.uid));
            const userData = userDoc.data();
            document.getElementById('user-display').textContent = userData.name;

            // NAVBAR LOGIK
            const navContainer = document.getElementById('nav-links-container');
            const userLink = document.getElementById('user-link-wrapper');
            if (userData.isAdmin) {
                const adminA = document.createElement('a'); adminA.href = 'admin.html'; adminA.textContent = 'Admin';
                navContainer.insertBefore(adminA, userLink);
            } else {
                const helpA = document.createElement('a'); helpA.href = 'help.html'; helpA.textContent = 'Hilfe ❓';
                navContainer.insertBefore(helpA, userLink);
            }
            const profA = document.createElement('a'); profA.href = 'prof.html'; profA.textContent = 'Professoren';
            navContainer.insertBefore(profA, userLink);

            loadSubjectDetails(userData.isAdmin);
        });

        async function loadSubjectDetails(isAdmin) {
            const sDoc = await getDoc(doc(db, "subjects", subjectId));
            if (sDoc.exists()) document.getElementById('subject-name').textContent = sDoc.data().name;

            const q = query(collection(db, "exams"), where("subjectId", "==", subjectId));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById('exam-list');
                list.innerHTML = "";
                snapshot.forEach((d) => {
                    const exam = d.data();
                    // Nur anzeigen wenn freigegeben ODER wenn man Admin ist
                    if (exam.status === 'approved' || isAdmin) {
                        const item = document.createElement('div');
                        item.className = 'exam-item';
                        item.innerHTML = `
                                <span>📄 ${exam.fileName} ${exam.status === 'pending' ? '<span class="status-badge">Wartet auf Freigabe</span>' : ''}</span>
                                <a href="${exam.url}" target="_blank" style="color:#2ecc71; font-weight:bold; text-decoration:none;">Download</a>
                            `;
                        list.appendChild(item);
                    }
                });
            });
        }

        window.handleUpload = async (file) => {
            if (!file || !subjectId) return;
            const status = document.getElementById('status');
            status.textContent = "Wird hochgeladen...";

            try {
                const sRef = ref(storage, `exams/${subjectId}/${Date.now()}_${file.name}`);
                const snap = await uploadBytes(sRef, file);
                const url = await getDownloadURL(snap.ref);

                await addDoc(collection(db, "exams"), {
                    subjectId: subjectId,
                    fileName: file.name,
                    url: url,
                    status: 'pending', // WICHTIG: Erstmal auf Warteliste
                    uploadedBy: auth.currentUser.uid,
                    createdAt: serverTimestamp()
                });
                status.textContent = "Erfolgreich! Wartet auf Admin-Freigabe.";
            } catch (e) { status.textContent = "Fehler beim Upload."; }
        };

        window.logout = () => signOut(auth).then(() => location.href = 'login.html');
    </script>
</body>
</html>
