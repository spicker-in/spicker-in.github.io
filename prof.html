<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Professoren – Spicker Informatik</title>
    <style>
        :root {
            --primary-blue: #1b4f72;
            --navbar-bg: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--primary-blue);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- EINHEITLICHE NAVBAR (MASTER DESIGN) --- */
        .navbar {
            background: var(--navbar-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 0 40px;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .nav-brand {
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

            .nav-links a {
                color: white;
                text-decoration: none;
                font-weight: 500;
                opacity: 0.8;
                transition: 0.3s;
                font-size: 0.95rem;
                white-space: nowrap;
            }

                .nav-links a:hover {
                    opacity: 1;
                }

        .user-link {
            text-decoration: none;
            transition: 0.3s;
            margin-left: 10px;
        }

            .user-link:hover .user-display {
                opacity: 1;
                text-decoration: underline;
            }

        .user-display {
            opacity: 0.7;
            font-size: 0.9rem;
            color: white;
            font-weight: bold;
        }

        .logout-btn {
            opacity: 0.5;
            font-size: 0.9rem;
            cursor: pointer;
            color: white;
            text-decoration: none;
        }

        /* --- CONTENT --- */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
            flex: 1;
        }

        .admin-section {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 15px;
            border: 1px dashed rgba(255,255,255,0.3);
            margin-bottom: 40px;
            display: none;
        }

        .prof-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
        }

        .prof-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            transition: transform 0.2s;
        }

        .prof-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #f1c40f;
            margin-bottom: 15px;
            background: #2c3e50;
        }

        .edit-icon {
            position: absolute;
            top: 15px;
            right: 15px;
            cursor: pointer;
            opacity: 0.4;
            font-size: 1.2rem;
            transition: 0.2s;
        }

            .edit-icon:hover {
                opacity: 1;
                color: #f1c40f;
                transform: rotate(45deg);
            }

        /* Anekdoten Bereich */
        .entries-container {
            margin-top: 20px;
            text-align: left;
            background: rgba(0,0,0,0.25);
            border-radius: 12px;
            padding: 15px;
            max-height: 350px;
            overflow-y: auto;
        }

        .entry {
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .entry-user {
            font-size: 0.75rem;
            color: #f1c40f;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .entry-text {
            font-size: 0.9rem;
            opacity: 0.9;
            line-height: 1.4;
        }

        .entry-img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 10px;
            display: block;
        }

        /* Inputs */
        input, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.95);
            color: #333;
            font-family: inherit;
        }

        .btn-action {
            background: #27ae60;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.2s;
        }

            .btn-action:hover {
                background: #2ecc71;
            }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">🎓 Spicker Informatik</div>
        <div class="nav-links" id="nav-links-container">
            <a href="start.html">Start</a>
            <a href="chat.html">Chat 💬</a>

            <!-- Dynamische Links (Hilfe, Admin, Prof) werden per JS hier eingefügt -->

            <a href="profil.html" id="user-link-wrapper" class="user-link">
                <span id="user-display" class="user-display">Lade...</span>
            </a>
            <a href="#" onclick="logout()" class="logout-btn">Abmelden</a>
        </div>
    </nav>

    <div class="container">
        <!-- ADMIN BEREICH: PROF HINZUFÜGEN -->
        <div id="admin-prof-add" class="admin-section">
            <h3 style="margin-top:0">👨‍🏫 Neuen Professor hinzufügen (Admin)</h3>
            <input type="text" id="new-prof-name" placeholder="Name des Professors">
            <label style="display:block; margin-top:15px; font-size: 0.8rem; opacity: 0.8;">Profilbild (optional):</label>
            <input type="file" id="new-prof-photo" accept="image/*">
            <button class="btn-action" onclick="addProfessor()">Professor anlegen</button>
        </div>

        <h1>Unsere Professoren</h1>
        <div class="prof-grid" id="prof-grid">
            <!-- Professoren-Karten werden hier geladen -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, onSnapshot, addDoc, updateDoc, query, orderBy, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let currentUserData = null;
        const DEFAULT_AVATAR = "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            const snap = await getDoc(doc(db, "users", user.uid));
            currentUserData = snap.data();
            if (!currentUserData) return;

            document.getElementById('user-display').textContent = currentUserData.name;

            const navContainer = document.getElementById('nav-links-container');
            const userLinkWrapper = document.getElementById('user-link-wrapper');

            // Navbar Links dynamisch aufbauen (Logik wie start.html)
            if (currentUserData.isAdmin) {
                const adminA = document.createElement('a'); adminA.href = 'admin.html'; adminA.textContent = 'Admin';
                navContainer.insertBefore(adminA, userLinkWrapper);
                document.getElementById('admin-prof-add').style.display = 'block';
            } else {
                const helpA = document.createElement('a'); helpA.href = 'help.html'; helpA.textContent = 'Hilfe ❓';
                navContainer.insertBefore(helpA, userLinkWrapper);
            }

            const profA = document.createElement('a');
            profA.href = 'prof.html';
            profA.textContent = 'Professoren';
            profA.style.borderBottom = "2px solid white"; // Aktiv markieren
            navContainer.insertBefore(profA, userLinkWrapper);

            loadProfessors();
        });

        // PROFESSOR HINZUFÜGEN (Admin)
        window.addProfessor = async () => {
            const name = document.getElementById('new-prof-name').value.trim();
            const file = document.getElementById('new-prof-photo').files[0];
            if (!name) return alert("Bitte gib einen Namen ein!");

            let photoUrl = DEFAULT_AVATAR;
            if (file) {
                const sRef = ref(storage, `profs/${Date.now()}_${file.name}`);
                const snap = await uploadBytes(sRef, file);
                photoUrl = await getDownloadURL(snap.ref);
            }

            await addDoc(collection(db, "professors"), {
                name: name, photoUrl: photoUrl, createdAt: serverTimestamp()
            });
            alert("Professor erfolgreich hinzugefügt!");
            document.getElementById('new-prof-name').value = '';
            document.getElementById('new-prof-photo').value = '';
        };

        // PROFESSOREN LADEN
        function loadProfessors() {
            onSnapshot(collection(db, "professors"), (snapshot) => {
                const grid = document.getElementById('prof-grid');
                grid.innerHTML = '';
                snapshot.forEach(d => {
                    const prof = d.data();
                    const card = document.createElement('div');
                    card.className = 'prof-card';
                    card.innerHTML = `
                                ${currentUserData.isAdmin ? `<span class="edit-icon" onclick="editProfessor('${d.id}', '${prof.name}')">⚙️</span>` : ''}
                                <img src="${prof.photoUrl || DEFAULT_AVATAR}" class="prof-img">
                                <h2 style="margin: 10px 0;">${prof.name}</h2>
                                <div class="entries-container" id="entries-${d.id}">Lade Anekdoten...</div>
                                <textarea id="input-text-${d.id}" placeholder="Schreibe eine Anekdote oder Info..."></textarea>
                                <input type="file" id="input-file-${d.id}" accept="image/*">
                                <button class="btn-action" onclick="addEntry('${d.id}')">Posten</button>
                            `;
                    grid.appendChild(card);
                    loadEntries(d.id);
                });
            });
        }

        // PROFESSOR BEARBEITEN (Admin)
        window.editProfessor = async (id, currentName) => {
            const newName = prompt("Neuen Namen für den Professor eingeben:", currentName);
            if (newName === null) return;

            const changePhoto = confirm("Möchtest du auch das Profilbild ändern?");

            if (changePhoto) {
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = 'image/*';
                fileInput.onchange = async (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const sRef = ref(storage, `profs/${Date.now()}_${file.name}`);
                    const snap = await uploadBytes(sRef, file);
                    const newPhotoUrl = await getDownloadURL(snap.ref);

                    await updateDoc(doc(db, "professors", id), {
                        name: newName || currentName,
                        photoUrl: newPhotoUrl
                    });
                    alert("Professor wurde aktualisiert!");
                };
                fileInput.click();
            } else {
                await updateDoc(doc(db, "professors", id), { name: newName || currentName });
                alert("Name wurde aktualisiert!");
            }
        };

        // BEITRÄGE/ANEKDOTEN LADEN
        function loadEntries(profId) {
            const q = query(collection(db, "prof_entries"), where("profId", "==", profId), orderBy("createdAt", "desc"));
            onSnapshot(q, (snap) => {
                const container = document.getElementById(`entries-${profId}`);
                container.innerHTML = snap.empty ? '<p style="opacity:0.5; font-size:0.8rem; text-align:center;">Noch keine Beiträge vorhanden.</p>' : '';
                snap.forEach(docEntry => {
                    const e = docEntry.data();
                    const div = document.createElement('div');
                    div.className = 'entry';

                    // Admin Logik: Name weglassen (Anonym)
                    const nameLabel = e.isAdminEntry ? '' : `<div class="entry-user">${e.userName}</div>`;

                    div.innerHTML = `
                            ${nameLabel}
                            <div class="entry-text">${e.text}</div>
                            ${e.photoUrl ? `<img src="${e.photoUrl}" class="entry-img">` : ''}
                        `;
                    container.appendChild(div);
                });
            });
        }

        // NEUEN BEITRAG POSTEN
        window.addEntry = async (profId) => {
            const text = document.getElementById(`input-text-${profId}`).value.trim();
            const file = document.getElementById(`input-file-${profId}`).files[0];
            if (!text && !file) return alert("Bitte gib einen Text ein oder wähle ein Foto!");

            let photoUrl = null;
            if (file) {
                const sRef = ref(storage, `prof_entries/${Date.now()}_${file.name}`);
                const snap = await uploadBytes(sRef, file);
                photoUrl = await getDownloadURL(snap.ref);
            }

            await addDoc(collection(db, "prof_entries"), {
                profId: profId,
                text: text,
                photoUrl: photoUrl,
                userName: currentUserData.name,
                isAdminEntry: currentUserData.isAdmin || false, // Merken ob Admin für Anonymität
                createdAt: serverTimestamp()
            });

            document.getElementById(`input-text-${profId}`).value = '';
            document.getElementById(`input-file-${profId}`).value = '';
        };

        window.logout = () => signOut(auth).then(() => window.location.href = 'login.html');
    </script>
</body>
</html>
