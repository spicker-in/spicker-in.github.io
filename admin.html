<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Admin – SpickerSeite</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window._db = db;
        window._auth = auth;
        window._fns = { collection, onSnapshot, doc, updateDoc, deleteDoc };
        document.dispatchEvent(new Event('fbReady'));
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>emailjs.init("1OMejyyUkbzLcwj7t");</script>

    <style>
        body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #ddd; text-align: left; }
        .btn { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; color: white; margin-right: 5px; }
        .btn-ok { background: #2ecc71; }
        .btn-del { background: #e74c3c; }
        .btn-perm { background: #9b59b6; }
        .perm-panel { background: #f9f9f9; padding: 15px; border: 1px solid #ddd; display: none; margin-top: 10px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠 Admin Dashboard</h1>
        <table>
            <thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Aktionen</th></tr></thead>
            <tbody id="user-list"></tbody>
        </table>
    </div>

    <script>
        const SUPERADMIN = 'julianknuhr92@gmail.com';
        document.addEventListener('fbReady', () => {
            window._auth.onAuthStateChanged(user => {
                if (!user || user.email !== SUPERADMIN) window.location.href = 'login.html';
                loadUsers();
            });
        });

        function loadUsers() {
            window._fns.onSnapshot(window._fns.collection(window._db, "users"), (snap) => {
                const list = document.getElementById('user-list');
                list.innerHTML = '';
                snap.forEach(d => {
                    const u = d.data();
                    if (u.email === SUPERADMIN) return;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${u.name}</td>
                        <td>${u.email}</td>
                        <td>${u.isApproved ? '✅ Aktiv' : '⏳ Wartet'}</td>
                        <td>
                            <button class="btn btn-ok" onclick="approve('${d.id}', '${u.email}', '${u.name}')">Freigeben</button>
                            <button class="btn btn-perm" onclick="togglePerms('${d.id}')">Berechtigungen</button>
                            <button class="btn btn-del" onclick="deleteU('${d.id}')">Löschen</button>
                            <div id="perms-${d.id}" class="perm-panel">
                                <strong>Seiten-Zugriff:</strong><br>
                                <input type="checkbox" ${u.permissions?.altklausuren ? 'checked' : ''} onchange="updatePerm('${d.id}', 'altklausuren', this.checked)"> Altklausuren<br>
                                <input type="checkbox" ${u.permissions?.skripte ? 'checked' : ''} onchange="updatePerm('${d.id}', 'skripte', this.checked)"> Skripte
                            </div>
                        </td>
                    `;
                    list.appendChild(tr);
                });
            });
        }

        async function approve(id, email, name) {
            await window._fns.updateDoc(window._fns.doc(window._db, "users", id), { isApproved: true });
            emailjs.send("service_7twg9kk", "template_fygcnxh", { to_email: email, to_name: name });
            alert("Nutzer freigeschaltet!");
        }

        function togglePerms(id) {
            const p = document.getElementById('perms-' + id);
            p.style.display = p.style.display === 'block' ? 'none' : 'block';
        }

        async function updatePerm(id, key, val) {
            const ref = window._fns.doc(window._db, "users", id);
            const update = {}; update[`permissions.${key}`] = val;
            await window._fns.updateDoc(ref, update);
        }

        async function deleteU(id) { if(confirm("Löschen?")) await window._fns.deleteDoc(window._fns.doc(window._db, "users", id)); }
    </script>
</body>
</html>
