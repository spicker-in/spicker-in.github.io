<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Admin – SpickerSeite</title>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window._db = db; window._auth = auth;
        window._fns = { collection, onSnapshot, doc, updateDoc, deleteDoc, signOut, query, orderBy };
        document.dispatchEvent(new Event('fbReady'));
    </script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; background: #1b4f72; color: white; padding: 15px 30px; border-radius: 12px; margin-bottom: 20px; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; border-bottom: 1px solid #eee; text-align: left; }
        .btn { padding: 8px 15px; border-radius: 50px; border: none; cursor: pointer; font-weight: bold; font-size: 12px; color: white; }
        .btn-approve { background: #2ecc71; }
        .btn-delete { background: #e74c3c; }
        .status-pending { color: #e67e22; font-weight: bold; }
        .status-active { color: #2ecc71; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h2>🛠 Julian's Live Dashboard</h2>
        <button class="btn" style="background:rgba(255,255,255,0.2)" onclick="window._fns.signOut(window._auth).then(()=>location.href='login.html')">Abmelden</button>
    </div>

    <div class="card">
        <h3>Benutzeranfragen (Live)</h3>
        <table>
            <thead><tr><th>Name</th><th>E-Mail</th><th>Status</th><th>Aktion</th></tr></thead>
            <tbody id="user-list"></tbody>
        </table>
    </div>

    <!-- Sound für neue Anfragen -->
    <audio id="ping-sound" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

    <script>
        const SUPERADMIN = 'julianknuhr92@gmail.com';
        let lastUserCount = -1;

        document.addEventListener('fbReady', () => {
            window._auth.onAuthStateChanged(user => {
                if (!user || user.email.toLowerCase() !== SUPERADMIN) window.location.href = 'login.html';
                
                // Echtzeit-Überwachung der Nutzer
                const q = window._fns.query(window._fns.collection(window._db, "users"), window._fns.orderBy("createdAt", "desc"));
                
                window._fns.onSnapshot(q, (snap) => {
                    const list = document.getElementById('user-list');
                    list.innerHTML = '';
                    
                    // Sound abspielen, wenn ein neuer Nutzer dazugekommen ist
                    if (lastUserCount !== -1 && snap.size > lastUserCount) {
                        document.getElementById('ping-sound').play();
                    }
                    lastUserCount = snap.size;

                    snap.forEach(d => {
                        const u = d.data();
                        if (u.email.toLowerCase() === SUPERADMIN) return;
                        
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td>${u.name}</td>
                            <td>${u.email}</td>
                            <td class="${u.isApproved ? 'status-active' : 'status-pending'}">${u.isApproved ? 'Aktiv' : 'Wartet...'}</td>
                            <td>
                                ${!u.isApproved ? `<button class="btn btn-approve" onclick="approve('${d.id}')">Freigeben</button>` : ''}
                                <button class="btn btn-delete" onclick="deleteUser('${d.id}')">Löschen</button>
                            </td>
                        `;
                        list.appendChild(tr);
                    });
                });
            });
        });

        async function approve(id) {
            await window._fns.updateDoc(window._fns.doc(window._db, "users", id), { isApproved: true });
        }

        async function deleteUser(id) {
            if(confirm("Nutzer wirklich löschen?")) await window._fns.deleteDoc(window._fns.doc(window._db, "users", id));
        }
    </script>
</body>
</html>
