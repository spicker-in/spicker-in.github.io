<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Startseite – SpickerSeite</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #1b4f72;
            color: white;
        }

        .navbar {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }

            .card:hover {
                background: rgba(255,255,255,0.2);
            }
    </style>
</head>
<body>
    <nav class="navbar">
        <div style="font-weight: bold;">🎓 Fachschaft Informatik</div>
        <div><span id="user-display"></span> | <a href="#" onclick="logout()" style="color:white">Abmelden</a></div>
    </nav>

    <div class="container">
        <h1>Deine Fächer</h1>
        <div class="subject-grid" id="subjects">
            <!-- Wird geladen -->
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            const snap = await getDoc(doc(db, "users", user.uid));
            const data = snap.data();

            if (!data || !data.isApproved) {
                alert("Nicht freigeschaltet!");
                signOut(auth).then(() => window.location.href = 'login.html');
                return;
            }

            document.getElementById('user-display').textContent = data.name;

            // Fächer laden
            onSnapshot(collection(db, "subjects"), (s) => {
                const grid = document.getElementById('subjects');
                grid.innerHTML = '';
                s.forEach(d => {
                    const sub = d.data();
                    const div = document.createElement('div');
                    div.className = 'card';
                    div.innerHTML = `<h3>${sub.name}</h3>`;
                    div.onclick = () => window.location.href = `fach.html?id=${d.id}`;
                    grid.appendChild(div);
                });
            });
        });

        window.logout = () => signOut(auth).then(() => window.location.href = 'login.html');
    </script>
</body>
</html>
