<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Startseite – SpickerSeite</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1b4f72;
            color: white;
        }

        .navbar {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        /* Admin Bereich Styles */
        .admin-panel {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px dashed rgba(255,255,255,0.3);
            display: none;
        }

            .admin-panel input {
                padding: 10px;
                border-radius: 5px;
                border: none;
                width: 250px;
                margin-right: 10px;
            }

        .btn {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-add {
            background: #27ae60;
            color: white;
        }

            .btn-add:hover {
                background: #2ecc71;
            }

        /* Fächer Grid */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            transition: transform 0.2s, background 0.2s;
        }

            .card:hover {
                background: rgba(255,255,255,0.2);
                transform: translateY(-5px);
            }

        .settings-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 18px;
            opacity: 0.6;
            padding: 5px;
        }

            .settings-icon:hover {
                opacity: 1;
                color: #f1c40f;
            }

        .visibility-badge {
            font-size: 10px;
            text-transform: uppercase;
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 10px;
            display: inline-block;
        }

        /* Modal Styles für E-Mail Auswahl */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #2c3e50;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 450px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .user-list {
            max-height: 300px;
            overflow-y: auto;
            margin: 20px 0;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 5px;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

            .user-item:last-child {
                border-bottom: none;
            }

            .user-item input {
                margin-right: 15px;
                transform: scale(1.2);
                cursor: pointer;
            }

            .user-item label {
                cursor: pointer;
                font-size: 14px;
                flex-grow: 1;
            }
    </style>
</head>
<body>
    <nav class="navbar">
        <div style="font-weight: bold; font-size: 1.2rem;">🎓 SpickerSeite</div>
        <div>
            <span id="user-display">Lade...</span> |
            <a href="#" onclick="logout()" style="color:white; text-decoration: none; opacity: 0.8;">Abmelden</a>
        </div>
    </nav>

    <div class="container">
        <div id="admin-area" class="admin-panel">
            <h3 style="margin-top:0;">Admin-Panel: Fach hinzufügen</h3>
            <input type="text" id="new-subject-name" placeholder="Name des Fachs (z.B. Mathe 1)">
            <button class="btn btn-add" onclick="createNewSubject()">+ Fach hinzufügen</button>
        </div>

        <h1>Deine Fächer</h1>
        <div class="subject-grid" id="subjects"></div>
    </div>

    <!-- Modal für E-Mail Auswahl -->
    <div id="user-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top:0;">Zugriff verwalten</h3>
            <p style="font-size: 0.9rem; opacity: 0.8;">Wähle die Nutzer aus, die dieses Fach sehen dürfen:</p>
            <div id="user-list" class="user-list">
                <!-- Nutzer werden hier geladen -->
            </div>
            <div style="text-align: right; margin-top: 20px;">
                <button class="btn" onclick="closeModal()" style="background:#7f8c8d; margin-right:10px;">Abbrechen</button>
                <button id="save-users-btn" class="btn btn-add">Auswahl speichern</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, getDocs, collection, onSnapshot, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserData = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            const snap = await getDoc(doc(db, "users", user.uid));
            currentUserData = snap.data();

            if (!currentUserData || !currentUserData.isApproved) {
                alert("Dein Account ist noch nicht freigeschaltet.");
                signOut(auth).then(() => window.location.href = 'login.html');
                return;
            }

            document.getElementById('user-display').textContent = currentUserData.name + (currentUserData.isAdmin ? " (Admin)" : "");
            if (currentUserData.isAdmin) document.getElementById('admin-area').style.display = 'block';

            loadSubjects(user.email, currentUserData.isAdmin);
        });

        function loadSubjects(userEmail, isAdmin) {
            onSnapshot(collection(db, "subjects"), (snapshot) => {
                const grid = document.getElementById('subjects');
                grid.innerHTML = '';

                snapshot.forEach(d => {
                    const sub = d.data();
                    const visibility = sub.visibility || 'alle';
                    const allowedEmails = sub.allowedEmails || [];

                    let hasAccess = isAdmin || visibility === 'alle' || (visibility === 'benutzerdefiniert' && allowedEmails.includes(userEmail.toLowerCase()));

                    if (hasAccess) {
                        const div = document.createElement('div');
                        div.className = 'card';
                        div.innerHTML = `
                                <h3>${sub.name}</h3>
                                ${isAdmin ? `<span class="settings-icon" onclick="event.stopPropagation(); window.manageVisibility('${d.id}', '${sub.name}', '${visibility}', ${JSON.stringify(allowedEmails)})">⚙️</span>` : ''}
                                ${isAdmin ? `<span class="visibility-badge">${visibility}</span>` : ''}
                            `;
                        div.onclick = () => window.location.href = `fach.html?id=${d.id}`;
                        grid.appendChild(div);
                    }
                });
            });
        }

        window.manageVisibility = async (id, name, currentVis, currentEmails) => {
            const mode = prompt(`Sichtbarkeit für "${name}" ändern:\n1 = Alle (Standard)\n2 = Niemand (Nur Admins)\n3 = Benutzerdefiniert (Nutzer auswählen)`, "1");

            if (mode === "1") {
                await updateDoc(doc(db, "subjects", id), { visibility: 'alle', allowedEmails: [] });
            } else if (mode === "2") {
                await updateDoc(doc(db, "subjects", id), { visibility: 'niemand', allowedEmails: [] });
            } else if (mode === "3") {
                openUserSelectionModal(id, name, currentEmails);
            }
        };

        async function openUserSelectionModal(subjectId, subjectName, currentEmails) {
            const modal = document.getElementById('user-modal');
            const list = document.getElementById('user-list');
            const saveBtn = document.getElementById('save-users-btn');

            document.getElementById('modal-title').textContent = `Zugriff: ${subjectName}`;
            list.innerHTML = '<p>Lade Nutzerliste...</p>';
            modal.style.display = 'flex';

            try {
                const usersSnap = await getDocs(collection(db, "users"));
                list.innerHTML = '';

                usersSnap.forEach(uDoc => {
                    const u = uDoc.data();
                    if (!u.email) return;

                    const isChecked = currentEmails.includes(u.email.toLowerCase());
                    const item = document.createElement('div');
                    item.className = 'user-item';
                    item.innerHTML = `
                            <input type="checkbox" id="chk-${uDoc.id}" value="${u.email.toLowerCase()}" ${isChecked ? 'checked' : ''}>
                            <label for="chk-${uDoc.id}">${u.name || 'Unbekannt'} <br><small>${u.email}</small></label>
                        `;
                    list.appendChild(item);
                });

                saveBtn.onclick = async () => {
                    const selected = Array.from(list.querySelectorAll('input:checked')).map(cb => cb.value);
                    await updateDoc(doc(db, "subjects", subjectId), {
                        visibility: 'benutzerdefiniert',
                        allowedEmails: selected
                    });
                    closeModal();
                };
            } catch (e) {
                list.innerHTML = '<p>Fehler beim Laden der Nutzer.</p>';
            }
        }

        window.closeModal = () => document.getElementById('user-modal').style.display = 'none';
        window.createNewSubject = async () => { /* ... wie vorher ... */ };
        window.logout = () => signOut(auth).then(() => window.location.href = 'login.html');
    </script>
</body>
</html>
