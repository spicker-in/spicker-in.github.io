<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Startseite – Spicker Informatik</title>
    <style>
        :root {
            --sidebar-bg: #f8f9fa;
            --sidebar-border: #dee2e6;
            --text-dark: #333;
            --primary-blue: #1b4f72;
            --hover-grey: #e9ecef;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--primary-blue);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- NAVBAR --- */
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 0 40px;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .nav-brand {
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

            .nav-links a {
                color: white;
                text-decoration: none;
                font-weight: 500;
                opacity: 0.8;
                transition: 0.3s;
                font-size: 0.95rem;
                white-space: nowrap;
            }

                .nav-links a:hover {
                    opacity: 1;
                }

        .user-link {
            text-decoration: none;
            transition: 0.3s;
            margin-left: 10px;
        }

            .user-link:hover .user-display {
                opacity: 1;
                text-decoration: underline;
            }

        .user-display {
            opacity: 0.7;
            font-size: 0.9rem;
            color: white;
            font-weight: bold;
        }

        .logout-btn {
            opacity: 0.5;
            font-size: 0.9rem;
            cursor: pointer;
            color: white;
            text-decoration: none;
        }

        /* --- LAYOUT --- */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--sidebar-border);
            display: flex;
            flex-direction: column;
            color: var(--text-dark);
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 1px solid var(--sidebar-border);
            color: var(--primary-blue);
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
        }

        .subject-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 1px solid var(--sidebar-border);
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-dark);
        }

            .subject-item:hover {
                background: var(--hover-grey);
            }

        .subject-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .chevron {
            font-size: 1.2rem;
            color: #adb5bd;
            margin-left: 10px;
        }

        .settings-icon {
            font-size: 16px;
            opacity: 0.3;
            padding: 5px;
            transition: 0.2s;
        }

            .settings-icon:hover {
                opacity: 1;
                color: #f39c12;
                transform: rotate(45deg);
            }

        /* Content Area */
        .content-area {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background: linear-gradient(135deg, #1b4f72 0%, #154360 100%);
        }

        .admin-panel {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px dashed rgba(255,255,255,0.3);
            display: none;
        }

            .admin-panel input {
                padding: 12px;
                border-radius: 5px;
                border: none;
                width: 300px;
                margin-right: 10px;
                background: white;
                color: #333;
            }

        .btn {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-add {
            background: #27ae60;
            color: white;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
        }

        .modal-content {
            background: #1b4f72;
            margin: 5% auto;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            color: white;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
        }

            .user-item:hover {
                background: rgba(255,255,255,0.1);
            }

            .user-item input {
                margin-right: 15px;
                width: 20px;
                height: 20px;
            }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">🎓 Spicker Informatik</div>
        <div class="nav-links" id="nav-links-container">
            <a href="start.html" style="border-bottom: 2px solid white;">Start</a>
            <a href="chat.html">Chat 💬</a>

            <!-- Dynamische Links (Hilfe, Admin, Prof) werden per JS hier eingefügt -->

            <a href="profil.html" id="user-link-wrapper" class="user-link">
                <span id="user-display" class="user-display">Lade...</span>
            </a>
            <a href="#" onclick="logout()" class="logout-btn">Abmelden</a>
        </div>
    </nav>

    <div class="main-layout">
        <aside class="sidebar">
            <div class="sidebar-header">Fächerübersicht</div>
            <div class="sidebar-list" id="subjects-list">
                <!-- Fächer werden hier geladen -->
            </div>
        </aside>

        <main class="content-area">
            <div id="admin-area" class="admin-panel">
                <h3 style="margin-top:0">Neues Fach anlegen</h3>
                <input type="text" id="new-subject-name" placeholder="Name des Fachs...">
                <button class="btn btn-add" onclick="createNewSubject()">Hinzufügen</button>
            </div>

            <div id="welcome-message">
                <h1>Willkommen!</h1>
                <p>Wähle links ein Fach aus, um die Inhalte zu sehen.</p>
            </div>
        </main>
    </div>

    <!-- MODAL FÜR ZUGRIFFSSTEUERUNG -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">Zugriff verwalten</h2>
            <div id="user-list-container"></div>
            <div style="margin-top: 25px; text-align: right; display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn" style="background:#7f8c8d; color:white;" onclick="closeModal()">Abbrechen</button>
                <button id="save-access-btn" class="btn btn-add">Speichern</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, onSnapshot, addDoc, updateDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserData = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }

            const snap = await getDoc(doc(db, "users", user.uid));
            currentUserData = snap.data();

            if (!currentUserData) return;

            document.getElementById('user-display').textContent = currentUserData.name;

            const navContainer = document.getElementById('nav-links-container');
            const userLinkWrapper = document.getElementById('user-link-wrapper');

            // Navbar Links dynamisch aufbauen
            if (currentUserData.isAdmin) {
                const adminA = document.createElement('a'); adminA.href = 'admin.html'; adminA.textContent = 'Admin';
                navContainer.insertBefore(adminA, userLinkWrapper);
                document.getElementById('admin-area').style.display = 'block';
            } else {
                const helpA = document.createElement('a'); helpA.href = 'help.html'; helpA.textContent = 'Hilfe ❓';
                navContainer.insertBefore(helpA, userLinkWrapper);
            }

            const profA = document.createElement('a'); profA.href = 'prof.html'; profA.textContent = 'Professoren';
            navContainer.insertBefore(profA, userLinkWrapper);

            loadSubjects(user.email, currentUserData.isAdmin);
        });

        function loadSubjects(userEmail, isAdmin) {
            onSnapshot(collection(db, "subjects"), (snapshot) => {
                const list = document.getElementById('subjects-list');
                list.innerHTML = '';
                snapshot.forEach(d => {
                    const sub = d.data();
                    const visibility = sub.visibility || 'alle';
                    const allowedEmails = sub.allowedEmails || [];

                    let hasAccess = isAdmin || visibility === 'alle' || (visibility === 'benutzerdefiniert' && allowedEmails.includes(userEmail.toLowerCase()));

                    if (hasAccess) {
                        const item = document.createElement('div');
                        item.className = 'subject-item';
                        item.innerHTML = `
                                <span class="subject-name">${sub.name}</span>
                                <div style="display:flex; align-items:center;">
                                    ${isAdmin ? `<span class="settings-icon" onclick="event.stopPropagation(); manageVisibility('subjects', '${d.id}', '${sub.name}', '${visibility}', ${JSON.stringify(allowedEmails)})">⚙️</span>` : ''}
                                    <span class="chevron">›</span>
                                </div>
                            `;
                        item.onclick = () => window.location.href = `fach.html?id=${d.id}`;
                        list.appendChild(item);
                    }
                });
            });
        }

        window.manageVisibility = async (coll, id, name, currentVis, currentEmails) => {
            const mode = prompt(`Sichtbarkeit für "${name}" ändern:\n1 = Alle\n2 = Nur Admins\n3 = Benutzerdefiniert\n4 = Fach LÖSCHEN 🗑️`, "1");
            if (!mode) return;

            if (mode === "4") {
                if (confirm(`Möchtest du das Fach "${name}" wirklich unwiderruflich löschen?`)) {
                    await deleteDoc(doc(db, coll, id));
                }
                return;
            }

            if (mode === "1" || mode === "2") {
                await updateDoc(doc(db, coll, id), {
                    visibility: mode === "1" ? 'alle' : 'niemand',
                    allowedEmails: []
                });
                return;
            }

            if (mode === "3") {
                const modal = document.getElementById('userModal');
                const container = document.getElementById('user-list-container');
                modal.style.display = 'block';
                container.innerHTML = '<p>Lade Nutzerliste...</p>';

                const usersSnap = await getDocs(collection(db, "users"));
                container.innerHTML = '';
                usersSnap.forEach(uDoc => {
                    const u = uDoc.data();
                    const email = u.email.toLowerCase();
                    const div = document.createElement('div');
                    div.className = 'user-item';
                    div.innerHTML = `<input type="checkbox" value="${email}" ${currentEmails.includes(email) ? 'checked' : ''}> <span>${u.name} (${email})</span>`;
                    div.onclick = (e) => { if (e.target.tagName !== 'INPUT') { const cb = div.querySelector('input'); cb.checked = !cb.checked; } };
                    container.appendChild(div);
                });

                document.getElementById('save-access-btn').onclick = async () => {
                    const selected = Array.from(container.querySelectorAll('input:checked')).map(cb => cb.value);
                    await updateDoc(doc(db, coll, id), {
                        visibility: 'benutzerdefiniert',
                        allowedEmails: selected
                    });
                    closeModal();
                };
            }
        };

        window.createNewSubject = async () => {
            const nameInput = document.getElementById('new-subject-name');
            const name = nameInput.value.trim();
            if (!name) return;
            try {
                await addDoc(collection(db, "subjects"), {
                    name, visibility: 'alle', allowedEmails: [], createdAt: new Date()
                });
                nameInput.value = '';
            } catch (e) { alert(e.message); }
            
        };

        window.closeModal = () => document.getElementById('userModal').style.display = 'none';
        window.logout = () => signOut(auth).then(() => window.location.href = 'login.html');
    </script>
</body>
</html>
