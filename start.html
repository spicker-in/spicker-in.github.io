<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Startseite – SpickerSeite</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1b4f72;
            color: white;
        }

        .navbar {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        /* Admin Bereich Styles */
        .admin-panel {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px dashed rgba(255,255,255,0.3);
            display: none;
        }

            .admin-panel input {
                padding: 10px;
                border-radius: 5px;
                border: none;
                width: 250px;
                margin-right: 10px;
            }

        .btn {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-add {
            background: #27ae60;
            color: white;
        }

            .btn-add:hover {
                background: #2ecc71;
            }

        /* Fächer Grid */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            transition: transform 0.2s, background 0.2s;
        }

            .card:hover {
                background: rgba(255,255,255,0.2);
                transform: translateY(-5px);
            }

        .settings-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 18px;
            opacity: 0.6;
            padding: 5px;
        }

            .settings-icon:hover {
                opacity: 1;
                color: #f1c40f;
            }

        .visibility-badge {
            font-size: 10px;
            text-transform: uppercase;
            background: rgba(0,0,0,0.3);
            padding: 2px 8px;
            border-radius: 10px;
            margin-top: 10px;
            display: inline-block;
        }

        /* NEU: Modal für Benutzerwahl */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.8);
        }

        .modal-content {
            background: #1b4f72;
            margin: 5% auto;
            padding: 25px;
            border: 1px solid rgba(255,255,255,0.2);
            width: 90%;
            max-width: 500px;
            border-radius: 15px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
        }

            .user-item:hover {
                background: rgba(255,255,255,0.1);
            }

            .user-item input {
                margin-right: 15px;
                cursor: pointer;
                width: 20px;
                height: 20px;
            }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-weight: bold;
        }

        .user-email {
            font-size: 0.85em;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div style="font-weight: bold; font-size: 1.2rem;">🎓 Informatik</div>
        <div>
            <span id="user-display">Lade...</span> |
            <a href="#" onclick="logout()" style="color:white; text-decoration: none; opacity: 0.8;">Abmelden</a>
        </div>
    </nav>

    <div class="container">
        <div id="admin-area" class="admin-panel">
            <h3 style="margin-top:0">Admin: Neues Fach erstellen</h3>
            <input type="text" id="new-subject-name" placeholder="Name des Fachs (z.B. Mathe 1)">
            <button class="btn btn-add" onclick="createNewSubject()">+ Fach hinzufügen</button>
        </div>

        <h1>Deine Fächer</h1>
        <div class="subject-grid" id="subjects"></div>
    </div>

    <!-- NEU: Das Auswahlfenster für die E-Mails -->
    <div id="userModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-top:0">Zugriff verwalten</h2>
            <p id="modal-subject-name" style="opacity: 0.7; margin-bottom: 20px;"></p>
            <div id="user-list-container">
                <!-- Hier werden die Nutzer reingeladen -->
            </div>
            <div style="margin-top: 30px; text-align: right; display: flex; gap: 10px; justify-content: flex-end;">
                <button class="btn" style="background: #7f8c8d; color: white;" onclick="closeModal()">Abbrechen</button>
                <button id="save-access-btn" class="btn btn-add">Speichern</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, getDocs, collection, onSnapshot, addDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserData = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            const snap = await getDoc(doc(db, "users", user.uid));
            currentUserData = snap.data();
            if (!currentUserData || !currentUserData.isApproved) {
                alert("Dein Account ist noch nicht freigeschaltet!");
                signOut(auth).then(() => window.location.href = 'login.html');
                return;
            }
            document.getElementById('user-display').textContent = currentUserData.name + (currentUserData.isAdmin ? " (Admin)" : "");
            if (currentUserData.isAdmin) {
                document.getElementById('admin-area').style.display = 'block';
            }
            loadSubjects(user.email, currentUserData.isAdmin);
        });

        function loadSubjects(userEmail, isAdmin) {
            onSnapshot(collection(db, "subjects"), (snapshot) => {
                const grid = document.getElementById('subjects');
                grid.innerHTML = '';
                snapshot.forEach(d => {
                    const sub = d.data();
                    const visibility = sub.visibility || 'alle';
                    const allowedEmails = sub.allowedEmails || [];
                    let hasAccess = false;
                    if (isAdmin) hasAccess = true;
                    else if (visibility === 'alle') hasAccess = true;
                    else if (visibility === 'benutzerdefiniert' && allowedEmails.includes(userEmail.toLowerCase())) hasAccess = true;

                    if (hasAccess) {
                        const div = document.createElement('div');
                        div.className = 'card';
                        div.innerHTML = `
                                <h3>${sub.name}</h3>
                                ${isAdmin ? `<span class="settings-icon" onclick="event.stopPropagation(); manageVisibility('${d.id}', '${sub.name}', '${visibility}', ${JSON.stringify(allowedEmails)})">⚙️</span>` : ''}
                                ${isAdmin ? `<span class="visibility-badge">${visibility}</span>` : ''}
                            `;
                        div.onclick = () => window.location.href = `fach.html?id=${d.id}`;
                        grid.appendChild(div);
                    }
                });
            });
        }

        window.createNewSubject = async () => {
            const nameInput = document.getElementById('new-subject-name');
            const name = nameInput.value.trim();
            if (!name) return;
            try {
                await addDoc(collection(db, "subjects"), {
                    name: name,
                    visibility: 'alle',
                    allowedEmails: [],
                    createdAt: new Date()
                });
                nameInput.value = '';
            } catch (e) { alert("Fehler: " + e.message); }
        };

        // --- HIER IST DIE NEUE LOGIK FÜR DIE SICHTBARKEIT ---
        window.manageVisibility = async (id, name, currentVis, currentEmails) => {
            const mode = prompt(`Sichtbarkeit für "${name}" ändern:\n1 = Alle\n2 = Niemand (Nur Admins)\n3 = Benutzerdefiniert (Nutzer wählen)`, "1");

            if (mode === "1" || mode === "2") {
                const newVis = mode === "1" ? 'alle' : 'niemand';
                await updateDoc(doc(db, "subjects", id), { visibility: newVis, allowedEmails: [] });
                return;
            }

            if (mode === "3") {
                const modal = document.getElementById('userModal');
                const container = document.getElementById('user-list-container');
                document.getElementById('modal-subject-name').textContent = `Fach: ${name}`;
                container.innerHTML = '<p>Lade Nutzerliste...</p>';
                modal.style.display = 'block';

                // Alle registrierten Nutzer aus Firestore laden
                const usersSnap = await getDocs(collection(db, "users"));
                container.innerHTML = '';

                usersSnap.forEach(userDoc => {
                    const userData = userDoc.data();
                    const email = (userData.email || "").toLowerCase();
                    if (!email) return;

                    const isChecked = currentEmails.includes(email) ? 'checked' : '';

                    const div = document.createElement('div');
                    div.className = 'user-item';
                    div.innerHTML = `
                            <input type="checkbox" value="${email}" ${isChecked}>
                            <div class="user-info">
                                <span class="user-name">${userData.name || 'Unbekannter Nutzer'}</span>
                                <span class="user-email">${email}</span>
                            </div>
                        `;
                    // Klick auf die ganze Zeile wählt die Checkbox aus
                    div.onclick = (e) => {
                        if (e.target.tagName !== 'INPUT') {
                            const cb = div.querySelector('input');
                            cb.checked = !cb.checked;
                        }
                    };
                    container.appendChild(div);
                });

                // Speichern-Button im Modal
                document.getElementById('save-access-btn').onclick = async () => {
                    const selectedEmails = Array.from(container.querySelectorAll('input:checked')).map(cb => cb.value);
                    try {
                        await updateDoc(doc(db, "subjects", id), {
                            visibility: 'benutzerdefiniert',
                            allowedEmails: selectedEmails
                        });
                        closeModal();
                    } catch (e) { alert("Fehler beim Speichern: " + e.message); }
                };
            }
        };

        window.closeModal = () => {
            document.getElementById('userModal').style.display = 'none';
        };

        window.logout = () => signOut(auth).then(() => window.location.href = 'login.html');
    </script>
</body>
</html>
