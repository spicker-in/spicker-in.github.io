<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Startseite – Spicker Informatik</title>
    <style>
        :root {
            --sidebar-bg: #f8f9fa;
            --sidebar-border: #dee2e6;
            --text-dark: #333;
            --primary-blue: #1b4f72;
            --hover-grey: #e9ecef;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--primary-blue);
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Einheitliche Navbar Proportionen */
        .navbar {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 0 40px;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            box-sizing: border-box;
        }

        .nav-brand {
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

            .nav-links a {
                color: white;
                text-decoration: none;
                font-weight: 500;
                opacity: 0.8;
                transition: 0.3s;
                font-size: 0.95rem;
            }

                .nav-links a:hover {
                    opacity: 1;
                }

        /* Profil-Link Styling */
        .user-link {
            text-decoration: none;
            transition: 0.3s;
            margin-left: 10px;
        }

            .user-link:hover .user-display {
                opacity: 1;
                text-decoration: underline;
            }

        .user-display {
            opacity: 0.7;
            font-size: 0.9rem;
            color: white;
            font-weight: bold;
        }

        .logout-btn {
            opacity: 0.5;
            font-size: 0.9rem;
        }

        /* Layout */
        .main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--sidebar-border);
            display: flex;
            flex-direction: column;
            color: var(--text-dark);
        }

        .sidebar-header {
            padding: 20px;
            font-size: 1.1rem;
            font-weight: bold;
            border-bottom: 1px solid var(--sidebar-border);
            color: var(--primary-blue);
        }

        .sidebar-list {
            flex: 1;
            overflow-y: auto;
        }

        .subject-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-bottom: 1px solid var(--sidebar-border);
            cursor: pointer;
            transition: background 0.2s;
            color: var(--text-dark);
        }

            .subject-item:hover {
                background: var(--hover-grey);
            }

        .subject-name {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .chevron {
            font-size: 1.2rem;
            color: #adb5bd;
            margin-left: 10px;
        }

        .content-area {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
            background: linear-gradient(135deg, #1b4f72 0%, #154360 100%);
        }

        .admin-panel {
            background: rgba(255, 255, 255, 0.05);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px dashed rgba(255,255,255,0.3);
            display: none;
        }

            .admin-panel input {
                padding: 12px;
                border-radius: 5px;
                border: none;
                width: 300px;
                margin-right: 10px;
            }

        .btn {
            padding: 10px 20px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-add {
            background: #27ae60;
            color: white;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">🎓 Spicker Informatik</div>
        <div class="nav-links" id="nav-links-container">
            <!-- Basis-Links -->
            <a href="start.html" style="border-bottom: 2px solid white;">Start</a>
            <a href="chat.html">Chat 💬</a>

            <!-- Dynamische Links (Hilfe, Admin, Fächer, Prof) werden per JS hier eingefügt -->

            <a href="profil.html" id="user-link-wrapper" class="user-link">
                <span id="user-display" class="user-display">Lade...</span>
            </a>
            <a href="#" onclick="logout()" class="logout-btn">Abmelden</a>
        </div>
    </nav>

    <div class="main-layout">
        <aside class="sidebar">
            <div class="sidebar-header">Fächerübersicht</div>
            <div class="sidebar-list" id="subjects-list"></div>
        </aside>

        <main class="content-area">
            <div id="admin-area" class="admin-panel">
                <h3 style="margin-top:0">Neues Fach anlegen</h3>
                <input type="text" id="new-subject-name" placeholder="Name des Fachs...">
                <button class="btn btn-add" onclick="createNewSubject()">Hinzufügen</button>
            </div>

            <div id="welcome-message">
                <h1>Willkommen!</h1>
                <p>Wähle links ein Fach aus. Klicke auf deinen Namen oben, um dein Profil zu bearbeiten.</p>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            const snap = await getDoc(doc(db, "users", user.uid));
            const data = snap.data();

            // Name im Profil-Link anzeigen
            document.getElementById('user-display').textContent = data.name;

            const navContainer = document.getElementById('nav-links-container');
            const userLinkWrapper = document.getElementById('user-link-wrapper');

            // 1. Hilfe-Link (NUR für Nicht-Admins)
            if (!data.isAdmin) {
                const helpA = document.createElement('a');
                helpA.href = 'help.html';
                helpA.textContent = 'Hilfe ❓';
                navContainer.insertBefore(helpA, userLinkWrapper);
            }

            // 2. Admin-Link (NUR für Admins)
            if (data.isAdmin) {
                const adminA = document.createElement('a');
                adminA.href = 'admin.html';
                adminA.textContent = 'Admin';
                navContainer.insertBefore(adminA, userLinkWrapper);

                // Admin-Bereich auf der Seite einblenden
                document.getElementById('admin-area').style.display = 'block';
            }

            // 3. Fächer & Professoren (FÜR ALLE)
            const fachA = document.createElement('a'); fachA.href = 'fach.html'; fachA.textContent = 'Fächer';
            const profA = document.createElement('a'); profA.href = 'prof.html'; profA.textContent = 'Professoren';

            navContainer.insertBefore(fachA, userLinkWrapper);
            navContainer.insertBefore(profA, userLinkWrapper);

            loadSubjects(user.email, data.isAdmin);
        });

        function loadSubjects(userEmail, isAdmin) {
            onSnapshot(collection(db, "subjects"), (snapshot) => {
                const list = document.getElementById('subjects-list');
                list.innerHTML = '';
                snapshot.forEach(d => {
                    const sub = d.data();
                    const visibility = sub.visibility || 'alle';
                    const allowedEmails = sub.allowedEmails || [];
                    let hasAccess = isAdmin || visibility === 'alle' || (visibility === 'benutzerdefiniert' && allowedEmails.includes(userEmail.toLowerCase()));

                    if (hasAccess) {
                        const item = document.createElement('div');
                        item.className = 'subject-item';
                        item.innerHTML = `<span class="subject-name">${sub.name}</span><span class="chevron">›</span>`;
                        item.onclick = () => window.location.href = `fach.html?id=${d.id}`;
                        list.appendChild(item);
                    }
                });
            });
        }

        window.logout = () => signOut(auth).then(() => window.location.href = 'login.html');

        window.createNewSubject = async () => {
            const nameInput = document.getElementById('new-subject-name');
            const name = nameInput.value.trim();
            if (!name) return;
            try {
                await addDoc(collection(db, "subjects"), {
                    name: name, visibility: 'alle', allowedEmails: [], createdAt: new Date()
                });
                nameInput.value = '';
            } catch (e) { alert(e.message); }
        };
    </script>
</body>
</html>
