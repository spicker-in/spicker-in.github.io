<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Profil – SpickerSeite</title>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1b4f72;
            color: white;
            min-height: 100vh;
        }

        .navbar {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

            .nav-links a {
                color: white;
                text-decoration: none;
                font-weight: 500;
                opacity: 0.8;
                transition: 0.3s;
            }

                .nav-links a:hover {
                    opacity: 1;
                }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            position: relative;
        }

        /* Punktestand Badge */
        .points-badge {
            background: #f1c40f;
            color: #1b4f72;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            display: inline-block;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(241, 196, 15, 0.3);
        }

        h2 {
            margin-top: 0;
            color: #fff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.2s;
        }

        .btn-save {
            background: #27ae60;
            color: white;
        }

            .btn-save:hover {
                background: #2ecc71;
            }
    </style>
</head>
<body>

    <nav class="navbar">
        <div style="font-weight: bold; font-size: 1.2rem;">🎓 Profil-Einstellungen</div>
        <div class="nav-links">
            <a href="start.html">Start</a>
            <a href="chat.html">Nachrichten 💬</a>
            <a href="profil.html" style="border-bottom: 2px solid white;">Profil</a>
            <a href="#" id="logout-link">Abmelden</a>
        </div>
    </nav>

    <div class="container">
        <!-- PUNKTESTAND -->
        <div class="card" style="text-align: center; border: 2px solid #f1c40f;">
            <h2>Dein Punktestand</h2>
            <div id="user-points" class="points-badge">0 Punkte</div>
            <button class="btn" style="margin-top:15px; background:#3498db; color:white;" onclick="location.href='chat.html'">Zum Chat & Benachrichtigungen</button>
            <p style="font-size: 0.8rem; margin-top: 15px; opacity: 0.7;">Lade Klausuren hoch, um Punkte zu verdienen!</p>
        </div>

        <!-- NAME ÄNDERN -->
        <div class="card">
            <h2>Name ändern</h2>
            <div class="form-group">
                <label>Dein Anzeigename</label>
                <input type="text" id="display-name" placeholder="Name laden...">
            </div>
            <button class="btn btn-save" onclick="updateName()">Name speichern</button>
        </div>

        <!-- PASSWORT ÄNDERN -->
        <div class="card">
            <h2>Passwort ändern</h2>
            <div class="form-group">
                <label>Neues Passwort</label>
                <input type="password" id="new-password" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Neues Passwort bestätigen</label>
                <input type="password" id="confirm-password" placeholder="••••••••">
            </div>
            <button class="btn btn-save" onclick="updateUserPassword()">Passwort aktualisieren</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, updatePassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            currentUser = user;

            // Live-Update für Name und Punkte
            onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('display-name').value = data.name || "";
                    document.getElementById('user-points').textContent = (data.points || 0) + " Punkte";
                }
            });
        });

        window.updateName = async () => {
            const newName = document.getElementById('display-name').value.trim();
            if (!newName) return alert("Bitte Namen eingeben.");
            await updateDoc(doc(db, "users", currentUser.uid), { name: newName });
            alert("Gespeichert!");
        };

        window.updateUserPassword = async () => {
            const p1 = document.getElementById('new-password').value;
            const p2 = document.getElementById('confirm-password').value;
            if (p1 !== p2 || p1.length < 6) return alert("Fehler bei den Passwörtern.");
            try {
                await updatePassword(currentUser, p1);
                alert("Passwort geändert!");
            } catch (e) { alert("Fehler: " + e.message); }
        };

        document.getElementById('logout-link').onclick = () => signOut(auth).then(() => window.location.href = 'login.html');
    </script>
</body>
</html>
