<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Profil – Spicker Informatik</title>
    <style>
        :root {
            --primary-blue: #1b4f72;
            --navbar-bg: rgba(255, 255, 255, 0.1);
            --gold: #f1c40f;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--primary-blue);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- EINHEITLICHE NAVBAR (MASTER DESIGN) --- */
        .navbar {
            background: var(--navbar-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 0 40px;
            height: 70px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .nav-brand {
            font-weight: bold;
            font-size: 1.2rem;
            color: white;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 25px;
        }

            .nav-links a {
                color: white;
                text-decoration: none;
                font-weight: 500;
                opacity: 0.8;
                transition: 0.3s;
                font-size: 0.95rem;
                white-space: nowrap;
            }

                .nav-links a:hover {
                    opacity: 1;
                }

        .user-link {
            text-decoration: none;
            transition: 0.3s;
            margin-left: 10px;
        }

            .user-link .user-display {
                opacity: 1;
                text-decoration: underline;
                font-size: 0.9rem;
                color: white;
                font-weight: bold;
            }

        .logout-btn {
            opacity: 0.5;
            font-size: 0.9rem;
            cursor: pointer;
            color: white;
            text-decoration: none;
        }

        /* --- CONTENT BEREICH --- */
        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            flex: 1;
        }

        .card {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
            position: relative;
        }

        /* Gold-Badge mit BTC Symbol */
        .gold-badge {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            color: #1b4f72;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.4rem;
            display: inline-block;
            margin-top: 10px;
            box-shadow: 0 4px 20px rgba(241, 196, 15, 0.4);
            border: 2px solid rgba(255,255,255,0.3);
        }

        h2 {
            margin-top: 0;
            color: #fff;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            box-sizing: border-box;
            font-size: 1rem;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            transition: 0.2s;
        }

        .btn-save {
            background: #27ae60;
            color: white;
        }

            .btn-save:hover {
                background: #2ecc71;
            }

        .btn-chat-link {
            background: #3498db;
            color: white;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-brand">🎓 Spicker Informatik</div>
        <div class="nav-links" id="nav-links-container">
            <a href="start.html">Start</a>
            <a href="chat.html">Chat 💬</a>
            <a href="profil.html" id="user-link-wrapper" class="user-link">
                <span id="user-display" class="user-display">Lade...</span>
            </a>
            <a href="#" onclick="logout()" class="logout-btn">Abmelden</a>
        </div>
    </nav>

    <div class="container">
        <!-- GOLD-BESTAND -->
        <div class="card" style="text-align: center; border: 2px solid var(--gold);">
            <h2 style="color: var(--gold);">🪙 Dein Goldbestand</h2>
            <div id="user-gold" class="gold-badge">₿ 0 Gold</div>
            <button class="btn btn-chat-link" onclick="location.href='chat.html'">Zum Chat & Benachrichtigungen</button>
            <p style="font-size: 0.8rem; margin-top: 15px; opacity: 0.7;">Lade Klausuren hoch, um wertvolles Gold zu verdienen!</p>
        </div>

        <!-- NAME ÄNDERN -->
        <div class="card">
            <h2>Name ändern</h2>
            <div class="form-group">
                <label>Dein Anzeigename</label>
                <input type="text" id="display-name" placeholder="Name laden...">
            </div>
            <button class="btn btn-save" onclick="updateName()">Name speichern</button>
        </div>

        <!-- PASSWORT ÄNDERN -->
        <div class="card">
            <h2>Passwort ändern</h2>
            <div class="form-group">
                <label>Neues Passwort</label>
                <input type="password" id="new-password" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Neues Passwort bestätigen</label>
                <input type="password" id="confirm-password" placeholder="••••••••">
            </div>
            <button class="btn btn-save" onclick="updateUserPassword()">Passwort aktualisieren</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, updatePassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFFoB1iSsfFyhDDPlsyNrTPf_mnpogVOc",
            authDomain: "spickersite.firebaseapp.com",
            projectId: "spickersite",
            storageBucket: "spickersite.firebasestorage.app",
            messagingSenderId: "515794720428",
            appId: "1:515794720428:web:f509322fe888fb3c8a3109"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'login.html'; return; }
            currentUser = user;

            onSnapshot(doc(db, "users", user.uid), (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    document.getElementById('user-display').textContent = data.name;
                    document.getElementById('display-name').value = data.name || "";

                    // Anzeige von Gold mit BTC Symbol
                    document.getElementById('user-gold').textContent = "₿ " + (data.points || 0) + " Gold";

                    // DYNAMISCHE NAVBAR
                    const navContainer = document.getElementById('nav-links-container');
                    const userLink = document.getElementById('user-link-wrapper');
                    navContainer.querySelectorAll('.dynamic-link').forEach(el => el.remove());

                    if (!data.isAdmin) {
                        const helpA = document.createElement('a');
                        helpA.href = 'help.html'; helpA.textContent = 'Hilfe ❓';
                        helpA.className = 'dynamic-link';
                        navContainer.insertBefore(helpA, userLink);
                    } else {
                        const adminA = document.createElement('a');
                        adminA.href = 'admin.html'; adminA.textContent = 'Admin';
                        adminA.className = 'dynamic-link';
                        navContainer.insertBefore(adminA, userLink);
                    }

                    const profA = document.createElement('a');
                    profA.href = 'prof.html'; profA.textContent = 'Professoren';
                    profA.className = 'dynamic-link';
                    navContainer.insertBefore(profA, userLink);
                }
            });
        });

        window.updateName = async () => {
            const newName = document.getElementById('display-name').value.trim();
            if (!newName) return alert("Bitte Namen eingeben.");
            await updateDoc(doc(db, "users", currentUser.uid), { name: newName });
            alert("Name gespeichert!");
        };

        window.updateUserPassword = async () => {
            const p1 = document.getElementById('new-password').value;
            const p2 = document.getElementById('confirm-password').value;
            if (p1 !== p2 || p1.length < 6) return alert("Fehler bei den Passwörtern.");
            try {
                await updatePassword(currentUser, p1);
                alert("Passwort geändert!");
            } catch (e) { alert("Fehler: " + e.message); }
        };

        window.logout = () => signOut(auth).then(() => window.location.href = 'login.html');
    </script>
</body>
</html>
